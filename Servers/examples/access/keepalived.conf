# Keepalived Configuration - RU Proxy
# Managed by Ansible - DO NOT EDIT MANUALLY
# Host: access-01 (203.0.113.1)

global_defs {
    router_id AI_PROXY_RU
    script_user root
    enable_script_security
}

# Проверка доступности Squid с автоперезапуском
# Проверка локального HTTP manager, три отказа → асинхронный restart.
# Cooldown 30s между попытками рестарта
vrrp_script check_squid {
    script "/usr/local/sbin/aiproxy-check-squid"
    interval 2
    timeout 3
    weight -20
    fall 3
    rise 2
}

vrrp_instance VI_SQUID {
    state MASTER
    interface eth0
    virtual_router_id 51

    priority 100

    advert_int 1

    authentication {
        auth_type PASS
        auth_pass DEMOONLY
    }

    virtual_ipaddress {
        192.0.2.10/24
    }

    track_script {
        check_squid
    }

}
