# Ansible managed
# Named ACME vhost; default HTTP sites remain owned by their projects.
upstream aiproxy_acme_peers {
    server 203.0.113.2:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name proxy.example.com;
    add_header Cache-Control "no-store" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        open_file_cache off;
        limit_except GET { deny all; }
        try_files $uri @aiproxy_acme_peer;
    }
    location @aiproxy_acme_peer {
        # A peer may serve its own token, but may never forward the miss again.
        if ($http_x_aiproxy_acme_hop != "") { return 404; }
        proxy_pass http://aiproxy_acme_peers;
        proxy_set_header Host proxy.example.com;
        proxy_set_header X-AIProxy-ACME-Hop 1;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Cache-Control;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_next_upstream error timeout invalid_header http_404 http_502 http_503 http_504;
        proxy_next_upstream_tries 1;
        proxy_next_upstream_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
    }
    location / { return 404; }
}
