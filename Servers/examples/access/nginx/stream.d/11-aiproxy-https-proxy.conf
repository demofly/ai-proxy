# Ansible managed
# Client HTTPS proxy; the public SNI router already prepends PROXY protocol.
upstream aiproxy_https_proxy {
    server 127.0.0.1:4445;
}

server {
    listen 127.0.0.1:4445 ssl proxy_protocol;
    # Restore the client address only on access; upstream transit stays anonymous.
    set_real_ip_from 127.0.0.1;
    ssl_certificate /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Squid receives HTTP/1.1 CONNECT. HTTP/2 inside the tunnel is independent.
    ssl_alpn http/1.1;
    ssl_handshake_timeout 10s;
    ssl_session_cache shared:aiproxy_https:128k;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    limit_conn aiproxy_transit 96;
    proxy_pass 127.0.0.1:3128;
    proxy_protocol on;
    proxy_connect_timeout 10s;
    proxy_timeout 3900s;
    proxy_socket_keepalive on;
    proxy_buffer_size 4k;
}
