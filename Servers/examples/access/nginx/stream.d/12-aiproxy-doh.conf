# Ansible managed
upstream aiproxy_doh {
    server 127.0.0.1:4446;
}
server {
    listen 127.0.0.1:4446 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    ssl_certificate /etc/letsencrypt/live/dns.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dns.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_alpn h2;
    ssl_handshake_timeout 10s;
    ssl_session_cache shared:aiproxy_doh:128k;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    # Public DoH: no client allowlist, authentication or per-address restriction.
    # Strip the router's PROXY header; Unbound receives raw HTTP/2 on loopback.
    proxy_pass 127.0.0.1:5443;
    proxy_protocol off;
    proxy_connect_timeout 3s;
    proxy_timeout 60s;
    proxy_socket_keepalive on;
    proxy_buffer_size 4k;
}
