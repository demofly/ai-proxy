# Ansible managed
# The outer SNI router prepends PROXY v1; strip it before Unbound's TLS socket.
upstream aiproxy_doh_upstream {
    server 127.0.0.1:4447;
}
server {
    listen 127.0.0.1:4447 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    allow 127.0.0.1;
    allow 203.0.113.1;
    allow 203.0.113.2;
    deny all;
    proxy_pass 127.0.0.1:8443;
    proxy_protocol off;
    proxy_connect_timeout 3s;
    proxy_timeout 300s;
    proxy_socket_keepalive on;
    proxy_buffer_size 4k;
}
