---
# [AITS] 2026-08-30T16:44:38Z

# ===========================================================================
# Фаза: инфраструктура nginx stream на upstream-узлах.
# ai-proxy — владелец nginx на узле: nginx.conf и 00-sni-router.conf принадлежат
# ему безусловно. Модульность обеспечивается предоставляемыми точками расширения:
#   stream{}             → /etc/nginx/stream.d/*.conf          — потоковые блоки
#   map{} маршрутизатора → /etc/nginx/stream.d/sni-map.d/*.conf — записи карты имён SNI
#   http{}               → /etc/nginx/conf.d/*.conf            — виртуальные хосты HTTP
# Сам MTProxy пользуется тем же контрактом: свой терминатор TLS и своя запись
# карты имён кладутся под собственным префиксом, чужие файлы не читаются.
# ===========================================================================

# Признак первой установки снимается ДО установки: после неё «поставили
# впервые» и «обновили версию» неразличимы — `changed` истинно в обоих случаях.
# Наличие /etc/nginx/nginx.conf означает, что пакет на узле уже стоял, кем бы он
# ни был поставлен: этим же проектом или соседним.
- name: Check whether nginx was present before this run (upstream)
  ansible.builtin.stat:
    path: /etc/nginx/nginx.conf
  register: _nginx_present_before

# ВНИМАНИЕ: nginx на узле ОДИН и разделяется с соседними проектами; роль
# mtproxy ставит его вторым, независимым от роли nginx путём — на upstream-узлах.
# Обновление пакета перезапускает службу силами postinst-сценария, и соединения
# соседних проектов рвутся вместе с нашими. Последствие принято сознательно:
# момент перезапуска приходится на прогон Ansible, известный оператору, а
# конфигурация обоих проектов лежит на диске до обновления, поэтому служба
# поднимается сразу в рабочем виде. `throttle: 1` не даёт разрыву совпасть на
# нескольких узлах. Заморозить версию: service_upgrades_enabled=false в inventory.
- name: Install nginx with stream module support (upstream)
  ansible.builtin.apt:
    name:
      - nginx
      - libnginx-mod-stream
    state: "{{ pkg_state }}"
    update_cache: true
  register: nginx_installed
  throttle: 1

# Fresh install: apt auto-starts nginx with default config.
# Stop it — we deploy full config first, then start with correct config.
# Демон nginx на узле один и обслуживает все виртуальные хосты сразу, поэтому
# перезапуск не применяется (при нём порты отпускаются не мгновенно и bind()
# отказывает): nginx обязан стартовать уже с итоговой конфигурацией.
#
# Условие проверяет ИМЕННО первую установку. Прежняя редакция гейта
# (`nginx_installed.changed`) при переходе на обновления останавливала бы общую
# службу узла при каждой новой версии в репозитории — то есть роняла бы и
# соседний проект, причём остановка была бы не следствием обновления, а нашим
# собственным действием поверх него. Симметричная правка сделана и в роли nginx:
# исправление в одном месте оставило бы дефект на upstream-узлах.
- name: Stop nginx after fresh install (config not ready yet)
  ansible.builtin.systemd:
    name: nginx
    state: stopped
  when:
    - nginx_installed.changed
    - not _nginx_present_before.stat.exists

- name: Create nginx stream.d directory (upstream)
  ansible.builtin.file:
    path: /etc/nginx/stream.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create SNI map fragment directory (upstream)
  ansible.builtin.file:
    path: /etc/nginx/stream.d/sni-map.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# Точка расширения ВНУТРИ блока, слушающего порт 443: соседний проект кладёт сюда
# директивы, которым нужно место в самом блоке (например, ограничение числа
# соединений). Собственного блока на этом порту у соседа быть не может — порт один.
- name: Create router extension directory for co-deployed projects (upstream)
  ansible.builtin.file:
    path: /etc/nginx/stream.d/router.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# Точка расширения уровня http{}: виртуальные хосты соседних проектов.
# Каталог создаётся независимо от того, кладёт ли в него файлы сам ai-proxy:
# его существование и есть предоставляемый контракт узла.
- name: Create nginx conf.d directory (http-level extension point, upstream)
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# Блок stream{} в nginx.conf с включением всего stream.d: единый маркер, чтобы
# повторное развёртывание правило собственную запись, а не добавляло вторую.
# Строка включения одна на каталог — сюда же попадают потоковые блоки соседей.
- name: Ensure stream block exists in nginx.conf (upstream)
  ansible.builtin.blockinfile:
    path: /etc/nginx/nginx.conf
    marker: "# {mark} ANSIBLE MANAGED - nginx stream block"
    insertafter: EOF
    block: |
      stream {
          include /etc/nginx/stream.d/*.conf;
      }
  notify: Reload nginx for mtproxy

# Включение conf.d на уровне http{}: в пакете Debian оно есть по умолчанию, но
# умолчание дистрибутива контрактом не является. Читаем nginx.conf, чтобы добавить
# строку только при её отсутствии: вторая строка включения того же каталога дала бы
# двойное объявление upstream и отказ конфигурации.
- name: Read nginx.conf to check http-level include of conf.d (upstream)
  ansible.builtin.slurp:
    src: /etc/nginx/nginx.conf
  register: _nginx_conf_raw

- name: Ensure http block includes conf.d fragments (upstream)
  ansible.builtin.blockinfile:
    path: /etc/nginx/nginx.conf
    marker: "    # {mark} ANSIBLE MANAGED - nginx http conf.d include"
    insertafter: '^\s*http\s*\{'
    block: "    include /etc/nginx/conf.d/*.conf;"
  when:
    # Вставка идёт внутрь http{}; без него blockinfile положил бы строку включения
    # на верхний уровень файла, где директива недопустима.
    - _nginx_conf_raw.content | b64decode is search('(?m)^\s*http\s*\{')
    # Закомментированная строка включения контрактом не является, поэтому
    # признак — начало строки без символа комментария.
    - not (_nginx_conf_raw.content | b64decode is search('(?m)^\s*include\s+/etc/nginx/conf\.d/\*\.conf'))
  notify: Reload nginx for mtproxy

# Маршрутизатор SNI принадлежит ai-proxy как владельцу nginx на узле и
# разворачивается безусловно: его редакция — единственная действующая.
# Расширяют его соседи не правкой файла, а своими фрагментами в sni-map.d.
- name: Deploy ai-proxy transit capacity zone (upstream)
  ansible.builtin.template:
    src: '{{ playbook_dir }}/templates/10-aiproxy-capacity.conf.j2'
    dest: /etc/nginx/stream.d/10-aiproxy-capacity.conf
    mode: '0644'
  notify: Reload nginx for mtproxy

- name: Deploy shared SNI router (upstream)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/00-sni-router.conf.j2"
    dest: /etc/nginx/stream.d/00-sni-router.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx for mtproxy

# ===========================================================================
# TLS certificate for access → upstream transit encryption
# ===========================================================================

- name: Create nginx SSL directory
  ansible.builtin.file:
    path: /etc/nginx/ssl
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate self-signed TLS certificate for MTProxy transit
  ansible.builtin.command:
    cmd: >
      openssl req -x509
      -newkey ec -pkeyopt ec_paramgen_curve:prime256v1
      -keyout /etc/nginx/ssl/mtproxy.key
      -out /etc/nginx/ssl/mtproxy.crt
      -days 3650 -nodes
      -subj '/CN=mtproxy-transit'
  args:
    creates: /etc/nginx/ssl/mtproxy.crt

- name: Set permissions on TLS key
  ansible.builtin.file:
    path: /etc/nginx/ssl/mtproxy.key
    owner: root
    group: root
    mode: '0600'

# ===========================================================================
# Развёртывание потоковых конфигураций MTProxy по тому же контракту каталогов:
# собственный терминатор TLS — файлом с префиксом проекта в stream.d,
# запись карты имён — файлом с префиксом проекта в stream.d/sni-map.d.
# ===========================================================================

# Migration: remove old monolithic config (pre co-deployment era)
- name: "Migration: remove old mtproxy-tls.conf"
  ansible.builtin.file:
    path: /etc/nginx/stream.d/mtproxy-tls.conf
    state: absent
  notify: Reload nginx for mtproxy

# Migration: remove access-side config that was incorrectly deployed to upstream
# (занимает порт 8443, отданный на upstream-узле виртуальным хостам HTTP)
- name: "Migration: remove stale 10-aiproxy-upstreams.conf from upstream"
  ansible.builtin.file:
    path: /etc/nginx/stream.d/10-aiproxy-upstreams.conf
    state: absent
  notify: Reload nginx for mtproxy

- name: "Migration: remove stale aiproxy SNI map from upstream"
  ansible.builtin.file:
    path: /etc/nginx/stream.d/sni-map.d/aiproxy.conf
    state: absent
  notify: Reload nginx for mtproxy

# Миграция: снятие терминатора TLS и записи Squid в карте SNI.
# Обе появились в промежуточной топологии, где Squid стоял за отдельным терминатором.
# Сейчас Squid — бэкенд маршрутизатора по умолчанию (fallback_squid), и они не нужны.
- name: "Migration: remove Squid TLS terminator (Squid is now the default backend)"
  ansible.builtin.file:
    path: /etc/nginx/stream.d/10-squid-tls-term.conf
    state: absent
  notify: Reload nginx for mtproxy

# Удаление включённого по умолчанию сайта nginx: он занимает порт 80 и мешает
# обновлению пакетов и проверкам; ни одна служба проекта этот порт не использует.
- name: "Migration: disable nginx default site (port 80 is unused by the project)"
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx for mtproxy

# ===========================================================================
# Пределы общего nginx: их задаёт ведущий проект узла
# ===========================================================================
# nginx на узле ОДИН, и worker_connections в нём одни на всех. ai-proxy —
# владелец nginx (см. заголовок роли), поэтому пределы задаёт он, а соседи
# их не трогают. Значение обязано покрывать нагрузку ВСЕХ проектов узла,
# а не только нашу: сосед, уступивший право задавать предел, не может
# восполнить его нехватку.
#
# Прежде эти строки не задавал никто из нашего проекта: при одиночном
# размещении действовало умолчание поставки (768 на рабочий процесс),
# при совместном их ставил сосед, выводя из числа СВОИХ пользователей.
- name: Bound shared nginx workers by its service memory
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^worker_processes'
    line: "worker_processes {{ proxy_nginx_workers | default(1) }};"
  notify: Reload nginx

- name: Tune shared nginx worker_connections (owner of the node's nginx)
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*worker_connections'
    line: "\tworker_connections {{ nginx_worker_connections | default(4096) }};"
    insertafter: '^\s*events\s*\{'
  notify: Reload nginx for mtproxy

# Предел дескрипторов рабочего процесса: соединение занимает два (клиентское
# и к цели), плюс запас на файлы и сокеты службы. Без него предел процесса
# остаётся системным и обрывает приём раньше, чем исчерпаются соединения.
- name: Set shared nginx worker_rlimit_nofile (owner of the node's nginx)
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*worker_rlimit_nofile'
    line: "worker_rlimit_nofile {{ nginx_worker_rlimit_nofile | default(fd_limit | default(65535)) }};"
    insertbefore: '^\s*events\s*\{'
  notify: Reload nginx for mtproxy

- name: Deploy MTProxy TLS terminator config (stream)
  ansible.builtin.template:
    src: nginx-mtproxy-stream.conf.j2
    dest: /etc/nginx/stream.d/10-mtproxy-tls.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx for mtproxy

- name: Deploy MTProxy SNI map entry
  ansible.builtin.template:
    src: sni-map.d/mtproxy.conf.j2
    dest: /etc/nginx/stream.d/sni-map.d/mtproxy.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx for mtproxy

# ===========================================================================
# Уборка прежних версий mtg
# ===========================================================================
# Каталоги версий накапливались без предела. Это цена отката без повторной загрузки,
# и потому умолчание — не удалять ничего: молчаливое исчезновение версии, на которую
# рассчитывал откат, дороже занятого места. Предел задаётся осознанно, в инвентори.
# Действующая версия из уборки исключена всегда, каким бы малым ни был предел.

- name: List installed mtg versions
  ansible.builtin.find:
    paths: /usr/local/lib/mtg
    file_type: directory
    recurse: false
  register: _mtg_versions
  changed_when: false
  when: (mtg_versions_keep | default(0) | int) > 0

- name: Remove mtg versions beyond the keep limit
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  # Действующая версия отбрасывается ДО среза, поэтому предел считает только
  # запасные: keep=2 означает «действующая плюс две прежние». Порядок — по времени
  # правки каталога, новые впереди; срез оставляет их и удаляет хвост.
  loop: >-
    {{ ((_mtg_versions.files | default([]))
        | rejectattr('path', 'equalto', '/usr/local/lib/mtg/' ~ mtproxy_version)
        | sort(attribute='mtime', reverse=true)
        | map(attribute='path') | list)[(mtg_versions_keep | default(0) | int):] }}
  loop_control:
    label: "{{ item }}"
  when: (mtg_versions_keep | default(0) | int) > 0

# ===========================================================================
# Терминация TLS участка access → upstream
# ===========================================================================
# Нужна ровно тогда, когда участок шифруется И Squid слушает за маршрутизатором.
# При незашифрованном участке Squid принимает соединения сам, и звено лишнее —
# отсюда прежний комментарий «bypasses nginx entirely», верный лишь для того случая.

- name: Deploy transit TLS material for the Squid terminator
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/tls/squid-transit.{{ item.ext }}"
    dest: "/etc/nginx/ssl/squid-transit.{{ item.ext }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { ext: 'crt', mode: '0644' }
    - { ext: 'key', mode: '0600' }
  loop_control:
    label: "squid-transit.{{ item.ext }}"
  when: squid_transit_tls | default(false) | bool
  notify: Reload nginx for mtproxy

- name: Deploy Squid TLS terminator config (stream)
  ansible.builtin.template:
    src: nginx-squid-tls-term.conf.j2
    dest: /etc/nginx/stream.d/20-squid-tls-term.conf
    owner: root
    group: root
    mode: '0644'
  when: squid_transit_tls | default(false) | bool
  notify: Reload nginx for mtproxy

- name: Deploy Squid SNI map entry
  ansible.builtin.template:
    src: sni-map.d/squid.conf.j2
    dest: /etc/nginx/stream.d/sni-map.d/squid.conf
    owner: root
    group: root
    mode: '0644'
  when: squid_transit_tls | default(false) | bool
  notify: Reload nginx for mtproxy

# Выключение признака убирает звено с узла, а не оставляет его работать втихую:
# иначе терминатор продолжал бы слушать порт и принимать соединения после того,
# как участок переведён на незашифрованный.
- name: Remove Squid TLS terminator when the leg is not encrypted
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/stream.d/20-squid-tls-term.conf
    - /etc/nginx/stream.d/sni-map.d/squid.conf
  when: not (squid_transit_tls | default(false) | bool)
  notify: Reload nginx for mtproxy

# Apply nginx config before starting mtg
- name: Flush nginx handlers before starting mtg
  ansible.builtin.meta: flush_handlers

- name: Enable and start nginx (upstream)
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

# ===========================================================================
# Phase: mtg daemon
# ===========================================================================

- name: Create mtproxy system user
  ansible.builtin.user:
    name: mtproxy
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# ---------------------------------------------------------------------------
# Установка mtg: версионированный каталог + переключение символьной ссылки
# ---------------------------------------------------------------------------
# Требование: смена номера версии в переменных ведёт к переустановке, повторный
# прогон с тем же номером не делает ничего.
#
# Устройство:
#   /usr/local/lib/mtg/{версия}/mtg — сам бинарник, по каталогу на версию;
#   /usr/local/bin/mtg              — символьная ссылка на выбранную версию,
#                                     путь из ExecStart юнита не меняется.
#
# Признак «версия установлена» — существование версионированного пути, а НЕ
# существование /usr/local/bin/mtg. Прежняя редакция проверяла второе, и потому
# смена mtproxy_version не приводила ни к чему: файл на месте — блок пропущен.
#
# Свойства схемы:
#   идемпотентность — при неизменном номере блок загрузки пропущен, а ссылка
#     уже указывает куда надо, и задача переключения не даёт `changed`;
#   применение новой версии — ссылка меняет цель, задача даёт `changed` и
#     уведомляет о перезапуске. Уведомление висит ИМЕННО на ссылке: работающий
#     процесс держит прежний inode, и без перезапуска новый бинарник на диске
#     остался бы неработающим (прежде перезапуск был подвешен только на mtg.toml
#     и на юнит, то есть смена бинарника службу не трогала);
#   откат — возврат прежнего номера версии: каталог предыдущей версии остаётся
#     на узле, повторная загрузка не нужна. Для MTProxy это существенно:
#     несовместимость клиентов обнаруживается уже после перезапуска.
- name: Determine system architecture for mtg download
  ansible.builtin.set_fact:
    mtg_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

# Каталог версий mtg; общий для всех установленных версий.
- name: Ensure versioned mtg install root exists
  ansible.builtin.file:
    path: /usr/local/lib/mtg
    state: directory
    owner: root
    group: root
    mode: "0755"

# Установлена ли ЗАДАННАЯ версия — единственный вопрос, решающий, нужна ли
# загрузка. Ответ не зависит от состояния /usr/local/bin/mtg.
- name: Check whether the requested mtg version is already installed
  ansible.builtin.stat:
    path: "/usr/local/lib/mtg/{{ mtproxy_version }}/mtg"
  register: mtg_versioned_binary

- name: Download and install mtg
  when: not mtg_versioned_binary.stat.exists
  block:
    # Контрольная сумма проверяется при непустом mtproxy_sha256. Пустое значение
    # оставлено умолчанием намеренно: обязательная сумма блокировала бы переход
    # на новую версию до её отыскания, то есть откладывала бы обновление
    # бессрочно. Заданная — закрывает распаковку стороннего архива в системный
    # каталог без проверки целостности.
    - name: Download mtg archive
      ansible.builtin.get_url:
        url: "https://github.com/9seconds/mtg/releases/download/v{{ mtproxy_version }}/mtg-{{ mtproxy_version }}-linux-{{ mtg_arch }}.tar.gz"
        dest: "/tmp/mtg-{{ mtproxy_version }}.tar.gz"
        mode: "0644"
        checksum: "{{ ('sha256:' + mtproxy_sha256) if (mtproxy_sha256 | default('') | length > 0) else omit }}"

    - name: Create temp directory for mtg extraction
      ansible.builtin.file:
        path: "/tmp/mtg-extract-{{ mtproxy_version }}"
        state: directory
        mode: "0755"

    - name: Extract mtg archive
      ansible.builtin.unarchive:
        src: "/tmp/mtg-{{ mtproxy_version }}.tar.gz"
        dest: "/tmp/mtg-extract-{{ mtproxy_version }}"
        remote_src: true

    # Поиск бинарника сохранён: имя файла внутри архива между выпусками плавает
    # (то `mtg`, то `mtg-{версия}-linux-{арх}`), и жёсткий путь ломался бы на
    # очередном выпуске.
    - name: Find mtg binary in extracted files
      ansible.builtin.shell:
        cmd: find /tmp/mtg-extract-{{ mtproxy_version }} -name 'mtg' -type f -o -name 'mtg-*-linux-*' -type f | head -1
      register: mtg_found_binary
      changed_when: false
      failed_when: mtg_found_binary.stdout == ""

    - name: Create versioned directory for this mtg release
      ansible.builtin.file:
        path: "/usr/local/lib/mtg/{{ mtproxy_version }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install mtg binary into its versioned directory
      ansible.builtin.copy:
        src: "{{ mtg_found_binary.stdout }}"
        dest: "/usr/local/lib/mtg/{{ mtproxy_version }}/mtg"
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Clean up temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/mtg-extract-{{ mtproxy_version }}"
        - "/tmp/mtg-{{ mtproxy_version }}.tar.gz"

# Переключение ссылки — единственный шаг, применяющий новую версию, и он же
# несёт уведомление о перезапуске службы.
#
# Миграция с прежней схемы: на узлах старых развёртываний /usr/local/bin/mtg —
# обычный файл; `force: true` заменяет его ссылкой. Замена выполняется только
# ПОСЛЕ заполнения версионированного каталога: при отказе загрузки блок выше
# прерывает роль, и прежний бинарник остаётся на месте нетронутым.
- name: Point /usr/local/bin/mtg at the requested version
  ansible.builtin.file:
    src: "/usr/local/lib/mtg/{{ mtproxy_version }}/mtg"
    dest: /usr/local/bin/mtg
    state: link
    owner: root
    group: root
    force: true
  notify: Restart mtg

- name: Create mtproxy config directory
  ansible.builtin.file:
    path: /etc/mtproxy
    state: directory
    owner: mtproxy
    group: mtproxy
    mode: "0750"

# Генерация секрета при первом деплое (если не задан вручную)
# Проверяем mtg.toml (v2) и mtg.env (legacy) для обратной совместимости
- name: Check if mtg config already exists (TOML)
  ansible.builtin.stat:
    path: /etc/mtproxy/mtg.toml
  register: mtg_toml_file

- name: Check if legacy mtg.env exists (migration from v1 format)
  ansible.builtin.stat:
    path: /etc/mtproxy/mtg.env
  register: mtg_env_file

- name: Generate mtg secret if not provided
  ansible.builtin.command:
    cmd: /usr/local/bin/mtg generate-secret --hex {{ mtproxy_fake_tls_domain }}
  register: mtg_generated_secret
  when:
    - mtproxy_secret == ""
    - not mtg_toml_file.stat.exists
    - not mtg_env_file.stat.exists
  changed_when: false
  no_log: true

- name: Read existing secret from TOML config
  ansible.builtin.shell:
    cmd: grep '^secret' /etc/mtproxy/mtg.toml | sed 's/.*"\(.*\)"/\1/'
  register: mtg_existing_secret_toml
  when:
    - mtproxy_secret == ""
    - mtg_toml_file.stat.exists
  changed_when: false
  no_log: true

- name: Read existing secret from legacy env file
  ansible.builtin.shell:
    cmd: grep '^MTG_SECRET=' /etc/mtproxy/mtg.env | cut -d= -f2
  register: mtg_existing_secret_env
  when:
    - mtproxy_secret == ""
    - not mtg_toml_file.stat.exists
    - mtg_env_file.stat.exists
  changed_when: false
  no_log: true

- name: Set mtproxy_secret fact
  no_log: true
  ansible.builtin.set_fact:
    mtproxy_secret_resolved: >-
      {%- if mtproxy_secret != "" -%}
        {{ mtproxy_secret }}
      {%- elif mtg_toml_file.stat.exists -%}
        {{ mtg_existing_secret_toml.stdout }}
      {%- elif mtg_env_file.stat.exists -%}
        {{ mtg_existing_secret_env.stdout }}
      {%- else -%}
        {{ mtg_generated_secret.stdout }}
      {%- endif -%}

- name: Deploy mtg TOML config (v2 format)
  ansible.builtin.template:
    src: mtg.toml.j2
    dest: /etc/mtproxy/mtg.toml
    owner: mtproxy
    group: mtproxy
    mode: "0640"
  notify: Restart mtg

- name: Remove legacy mtg.env if migrated to TOML
  ansible.builtin.file:
    path: /etc/mtproxy/mtg.env
    state: absent
  when: mtg_env_file.stat.exists | default(false)

- name: Deploy mtproxy users file
  ansible.builtin.template:
    src: users.txt.j2
    dest: /etc/mtproxy/users.txt
    owner: mtproxy
    group: mtproxy
    mode: "0640"

- name: Deploy mtg systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/mtg.service
    mode: "0644"
    content: |
      [Unit]
      Description=MTProxy (mtg) for Telegram
      After=network.target nginx.service

      [Service]
      Type=simple
      User=mtproxy
      Group=mtproxy
      ExecStart=/usr/local/bin/mtg run /etc/mtproxy/mtg.toml
      Restart=on-failure
      RestartSec=5
      Environment=GOMEMLIMIT={{ (mem_mtproxy_mb | default(32) | int * 0.65) | int }}MiB
      MemoryMax={{ mem_mtproxy_mb | default(32) }}M
      LimitNOFILE=4096

      [Install]
      WantedBy=multi-user.target
  notify:
    - Reload systemd for mtg
    - Restart mtg

- name: Reload systemd after mtg unit deploy
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start mtg
  ansible.builtin.systemd:
    name: mtg
    state: started
    enabled: true

# ===========================================================================
# Firewall для MTProxy
# ===========================================================================
# Правила файрвола для MTProxy (порт 443) консолидированы в playbook.yml
# (секция "Phase: Firewall") для корректного порядка выполнения:
# миграция Squid-правил → добавление MTProxy-правил.
