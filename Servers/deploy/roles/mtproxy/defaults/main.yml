---
# [AITS] 2026-08-29T11:04:55Z
# Включение/отключение MTProxy
mtproxy_enabled: false
mtproxy_fake_tls_domain: max.ru

# Сопровождение версий пакетов из репозиториев ОС (nginx, libnginx-mod-stream).
#   true  — прогон доводит пакеты роли до последней доступной версии;
#   false — версии замораживаются на установленных.
# Умолчание роли повторяет умолчание playbook.yml, чтобы роль оставалась
# работоспособной при отдельном запуске по тегу `mtproxy`. Действующее значение
# задаётся в inventory и перекрывает это (умолчания роли — низший приоритет).
# К версии mtg флаг отношения не имеет: её задаёт mtproxy_version.
service_upgrades_enabled: true

# Состояние пакета, выведенное из флага выше.
pkg_state: "{{ 'latest' if service_upgrades_enabled | bool else 'present' }}"

# Версия mtg (github.com/9seconds/mtg).
#
# ЕДИНСТВЕННЫЙ источник значения для рабочих узлов — эта строка. Рабочий
# inventory переопределяет её только при отступлении от поддерживаемой проектом
# версии (проверка совместимости клиентов — на операторе); образец
# inventory.yml.sample держится в согласии с ней.
#
# Смена номера ведёт к ПЕРЕУСТАНОВКЕ: бинарник ставится в
# /usr/local/lib/mtg/{версия}/mtg, а /usr/local/bin/mtg — символьная ссылка на
# него. Прогон с прежним номером не делает ничего. Откат — возврат прежнего
# номера: каталог предыдущей версии остаётся на узле, повторная загрузка не
# нужна, переключается только ссылка.
mtproxy_version: "2.2.8"

# Контрольная сумма архива mtg заданной версии (SHA-256, без префикса).
# Пусто — проверка не выполняется: иначе переход на новую версию блокировался бы
# до тех пор, пока сумма не найдена, и обновление откладывалось бы бессрочно.
# Заполненное значение проверяется при загрузке, и подменённый архив в
# /usr/local/lib не попадёт. Сумма публикуется в разделе выпуска на GitHub.
mtproxy_sha256: ""

# Локальный порт mtg daemon (behind nginx TLS on 127.0.0.1)
mtproxy_local_port: 2083

# Секрет mtg (hex). Пустая строка = автогенерация при первом деплое
mtproxy_secret: ""

# Публичный домен для MTProxy (для SNI-роутинга). Пустая строка = только по fake-TLS домену
mtproxy_hostname: ""

# Порт локального TLS-терминатора на upstream (SNI router → TLS term → mtg)
mtproxy_tls_port: 4443

# Порт TLS relay на access nodes (SNI router → relay → TLS 1.3 → upstream)
mtproxy_relay_port: 9443

# Реестр пользователей (для администратора)
mtproxy_users:
  - name: "Initial User"
    telegram: "@admin"
    granted: "{{ ansible_date_time.date }}"
    note: "Default user"
