---
# Конфигурация резолвера применяется ПЕРЕЗАПУСКОМ, а не перезагрузкой. Служба
# перезагрузку поддерживает (в юните объявлен ExecReload по сигналу HUP, проба принята
# на узле), но перезагрузка не подхватывает часть изменений — число рабочих потоков,
# порт слушателя, число сегментов кеша, — а развёртывание меняет конфигурацию целиком
# и различить безопасные изменения от требующих перезапуска не может. Цена решения
# названа: перезапуск сбрасывает кеш имён, и они разрешаются заново.
#
# Обработчик перезагрузки здесь прежде объявлялся и не вызывался ни одной задачей;
# снят как вводящий в заблуждение. Обработчик перезапуска systemd-resolved снят
# по той же причине: то же действие выполняет задача роли напрямую, по своему условию.
- name: "Перезапустить Unbound"
  ansible.builtin.systemd:
    name: unbound
    state: restarted
