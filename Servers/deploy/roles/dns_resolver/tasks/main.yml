---
# [AITS] 2026-08-29T11:04:55Z
# Роль: dns_resolver — кеширующий DNS-резолвер (unbound)
#
# Архитектура:
#   upstream — резолвит через публичные DNS (dns_servers из inventory)
#   access   — резолвит ТОЛЬКО через unbound на upstream-нодах
#
# Зависимости: dns-root-data (Debian) для DNSSEC trust anchor

- name: Calculate unbound resource limits
  ansible.builtin.set_fact:
    _dns_threads: "{{ dns_resolver_threads | default([ansible_processor_vcpus | default(1) | int, [mem_unbound_mb | default(32) | int // 64, 1] | max] | min) }}"
    # Four cache shares plus up to 2.5x malloc overhead; keep room for the resolver.
    _dns_cache_mb: "{{ dns_resolver_cache_mb | default([((mem_unbound_mb | default(32) | int) / 24) | int, 1] | max) }}"

- name: Validate resolver cache and thread overrides against memory
  ansible.builtin.assert:
    that:
      - _dns_threads | int >= 1
      - _dns_cache_mb | int >= 1
      - _dns_cache_mb | int * 10 + _dns_threads | int * 4 + 8 <= mem_unbound_mb | int
    fail_msg: "Unbound cache/thread overrides exceed the service budget (including malloc and base overhead)."

# Обновление unbound перезапускает резолвер: на время перезапуска узел не
# резолвит имена, а access-ноды — те, что форвардят на upstream, — теряют
# соответствующего вышестоящего резолвера. Отсюда `throttle: 1`: задача не
# выполняется более чем на одном узле разом, и пара upstream-резолверов не
# уходит в перезапуск одновременно. У access-ноды в списке форвардеров все
# upstream-ноды, поэтому выпадение одного она переживает.
# Обновление dns-root-data приносит свежий якорь доверия DNSSEC и службы
# не касается.
- name: Install unbound (Debian family)
  ansible.builtin.apt:
    name:
      - unbound
      - dns-root-data
    state: "{{ pkg_state }}"
  when: ansible_os_family == 'Debian'
  throttle: 1

- name: Install unbound (RHEL family)
  ansible.builtin.dnf:
    name:
      - unbound
    state: "{{ pkg_state }}"
  when: ansible_os_family == 'RedHat'
  throttle: 1

# DNSSEC root trust anchor — /var/lib/unbound/ writable для unbound
- name: Ensure /var/lib/unbound directory exists
  ansible.builtin.file:
    path: /var/lib/unbound
    state: directory
    owner: unbound
    group: unbound
    mode: '0755'

- name: Initialize DNSSEC root trust anchor
  ansible.builtin.command: unbound-anchor -a /var/lib/unbound/root.key
  args:
    creates: /var/lib/unbound/root.key
  register: _anchor_result
  # unbound-anchor returns 1 when it updates the key (normal), 0 when unchanged
  failed_when: _anchor_result.rc not in [0, 1]

- name: Fix root.key ownership
  ansible.builtin.file:
    path: /var/lib/unbound/root.key
    owner: unbound
    group: unbound
    mode: '0644'

# Кому разрешено обращаться к резолверу (upstream слушает внешний адрес).
# Основной источник — dns_allowed_clients из playbook.yml, общий с правилами
# firewall. Fallback по группе access_proxies оставлен, чтобы роль работала
# автономно (вызов без playbook.yml, например из другого плейбука).
- name: Set DNS client allowlist (shared with firewall rules)
  ansible.builtin.set_fact:
    _dns_allowed_clients: >-
      {{ dns_allowed_clients | default(
           groups['access_proxies'] | default([]) | map('extract', hostvars, 'ansible_host') | list
           + (dns_extra_clients | default([]))) | unique | list }}

# Определяем upstream DNS-серверы в зависимости от роли
# access → unbound на upstream-нодах; upstream → публичные DNS из inventory
- name: Set upstream forwarders (access → upstream unbound instances)
  ansible.builtin.set_fact:
    _dns_forwarders: >-
      {{ groups['upstreams'] | map('extract', hostvars, 'ansible_host') | list }}
  when: proxy_role == 'access'

- name: Set upstream forwarders (upstream → public DNS)
  ansible.builtin.set_fact:
    _dns_forwarders: "{{ dns_servers | default(['9.9.9.9', '8.8.8.8', '1.1.1.1']) }}"
  when: proxy_role == 'upstream'

- name: Deploy unbound config
  ansible.builtin.template:
    src: unbound.conf.j2
    dest: /etc/unbound/unbound.conf
    owner: root
    group: root
    mode: '0644'
    validate: 'unbound-checkconf %s'
  notify: Restart unbound

# Firewall: DNS-правила для upstream управляются в основном playbook
# (nftables-upstream.conf.j2 / iptables / ufw)

# Отключаем systemd-resolved если он занимает порт 53
- name: Check if systemd-resolved is active
  ansible.builtin.command: systemctl is-active systemd-resolved
  register: _resolved_status
  changed_when: false
  failed_when: false

- name: Disable systemd-resolved stub listener
  when: _resolved_status.stdout == 'active'
  block:
    - name: Create resolved.conf.d directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Disable DNSStubListener
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/no-stub.conf
        content: |
          [Resolve]
          DNSStubListener=no
        owner: root
        group: root
        mode: '0644'
      register: _stub_disabled

    - name: Restart systemd-resolved to release port 53
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when: _stub_disabled.changed

    - name: Ensure /etc/resolv.conf points to localhost
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          # Managed by Ansible (dns_resolver role)
          nameserver 127.0.0.1
        owner: root
        group: root
        mode: '0644'

- name: Set /etc/resolv.conf to localhost (no systemd-resolved)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Managed by Ansible (dns_resolver role)
      nameserver 127.0.0.1
    owner: root
    group: root
    mode: '0644'
  when: _resolved_status.stdout != 'active'

- name: Enable and start unbound
  ansible.builtin.systemd:
    name: unbound
    enabled: true
    state: started

# Перезапуск по изменению конфигурации применяется здесь, а не в конце плея.
# Причина: (1) следующая задача проверяет слушателя, и без сброса очереди она
# сверяла бы прежний процесс; (2) при обрыве плея на любой более поздней задаче
# handler не выполнился бы вовсе — резолвер молча остался бы со старой
# конфигурацией, а повторный прогон его бы не починил (шаблон уже не меняется).
- name: Apply pending unbound restart
  ansible.builtin.meta: flush_handlers

# а процесс — слушать не там. Для upstream внешний адрес обязателен: именно
# на него ходят access-ноды.
# Расхождение процесса с конфигурацией — это дрейф состояния, поэтому оно
# устраняется перезапуском и перепроверяется; отказ выносится только если
# слушателя нет и после перезапуска.
- name: Ensure unbound listens where the role configured it
  block:
    - name: Verify unbound listeners
      ansible.builtin.wait_for:
        port: "{{ dns_resolver_port | default(53) }}"
        state: started
        timeout: 15
      loop: "{{ _dns_listen_addresses }}"
  rescue:
    - name: Restart unbound (process diverged from deployed config)
      ansible.builtin.systemd:
        name: unbound
        state: restarted

    - name: Re-verify unbound listeners after restart
      ansible.builtin.wait_for:
        host: "{{ item }}"
        port: "{{ dns_resolver_port | default(53) }}"
        state: started
        timeout: 15
      loop: "{{ _dns_listen_addresses }}"
  vars:
    _dns_listen_addresses: "{{ ['127.0.0.1'] + ([ansible_host] if proxy_role == 'upstream' else []) }}"
