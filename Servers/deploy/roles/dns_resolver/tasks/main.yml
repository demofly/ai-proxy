---
# [AITS] 2026-08-29T11:04:55Z
# Роль: dns_resolver — кеширующий DNS-резолвер (unbound)
#
# Архитектура:
#   upstream — резолвит через публичные DNS (dns_servers из inventory)
#   access   — Unbound → локальный dnsproxy → DoH upstream (TLS verify off)
#
# Зависимости: dns-root-data (Debian) для DNSSEC trust anchor

- name: "Рассчитать пределы ресурсов Unbound"
  ansible.builtin.set_fact:
    _dns_threads: "{{ dns_resolver_threads | default([ansible_processor_vcpus | default(1) | int, [mem_unbound_mb | default(32) | int // 64, 1] | max] | min) }}"
    # Four cache shares plus up to 2.5x malloc overhead; keep room for the resolver.
    _dns_cache_mb: "{{ dns_resolver_cache_mb | default([((mem_unbound_mb | default(32) | int) / 24) | int, 1] | max) }}"

- name: "Проверить размеры кеша и число потоков Unbound по бюджету памяти"
  ansible.builtin.assert:
    that:
      - _dns_threads | int >= 1
      - _dns_cache_mb | int >= 1
      - _dns_cache_mb | int * 10 + _dns_threads | int * 4 + 8 <= mem_unbound_mb | int
    fail_msg: "Заданные кеши и потоки Unbound превышают бюджет памяти службы с учётом malloc и служебных расходов."
    success_msg: 'Кеши и потоки Unbound помещаются в бюджет памяти службы.'

# Обновление unbound перезапускает резолвер: на время перезапуска узел не
# резолвит имена, а access-ноды — те, что форвардят на upstream, — теряют
# соответствующего вышестоящего резолвера. Отсюда `throttle: 1`: задача не
# выполняется более чем на одном узле разом, и пара upstream-резолверов не
# уходит в перезапуск одновременно. У access-ноды в списке форвардеров все
# upstream-ноды, поэтому выпадение одного она переживает.
# Обновление dns-root-data приносит свежий якорь доверия DNSSEC и службы
# не касается.
- name: "Установить Unbound (Debian)"
  ansible.builtin.apt:
    name:
      - unbound
      - dns-root-data
      - curl
      - openssl
    state: "{{ pkg_state }}"
  when: ansible_os_family == 'Debian'
  throttle: 1

- name: "Установить Unbound (RHEL)"
  ansible.builtin.dnf:
    name:
      - unbound
      - curl
      - openssl
    state: "{{ pkg_state }}"
  when: ansible_os_family == 'RedHat'
  throttle: 1

- name: "Исключить занятие нового DNS backend чужой службой"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import subprocess,sys
        output = subprocess.check_output(['ss', '-H', '-ltnp', 'sport = :' + sys.argv[1]], text=True)
        if any('"unbound"' not in line for line in output.splitlines()):
            raise SystemExit('Порт DNS backend занят другой службой; выберите свободный внутренний порт')
      - "{{ (dns_doh_backend_port | default(8443) if proxy_role == 'upstream' else dns_doh_local_port | default(5443)) | int | string }}"
  changed_when: false
  when: proxy_role == 'upstream' or dns_doh_enabled | default(false) | bool

# DNSSEC root trust anchor — /var/lib/unbound/ writable для unbound
- name: "Создать каталог данных Unbound"
  ansible.builtin.file:
    path: /var/lib/unbound
    state: directory
    owner: unbound
    group: unbound
    mode: '0755'

- name: "Инициализировать корневой ключ DNSSEC из подписанного пакета ОС"
  ansible.builtin.copy:
    src: /usr/share/dns/root.key
    dest: /var/lib/unbound/root.key
    remote_src: true
    force: false
    owner: unbound
    group: unbound
    mode: '0644'
  when: ansible_os_family == 'Debian'

- name: "Инициализировать корневой ключ доверия DNSSEC на RHEL"
  ansible.builtin.command: unbound-anchor -a /var/lib/unbound/root.key
  args:
    creates: /var/lib/unbound/root.key
  register: _anchor_result
  # unbound-anchor returns 1 when it updates the key (normal), 0 when unchanged
  failed_when: _anchor_result.rc not in [0, 1]
  when: ansible_os_family == 'RedHat'

- name: "Установить владельца корневого ключа DNSSEC"
  ansible.builtin.file:
    path: /var/lib/unbound/root.key
    owner: unbound
    group: unbound
    mode: '0644'

- name: "Подготовить DoH на upstream"
  ansible.builtin.include_tasks: doh-upstream.yml
  when: proxy_role == 'upstream'

- name: "Подготовить транспорт DoH на access"
  ansible.builtin.include_tasks: doh-bridge.yml
  when: proxy_role == 'access'

# Кому разрешено обращаться к резолверу (upstream слушает внешний адрес).
# Основной источник — dns_allowed_clients из playbook.yml, общий с правилами
# firewall. Fallback по группе access_proxies оставлен, чтобы роль работала
# автономно (вызов без playbook.yml, например из другого плейбука).
- name: "Определить общий список разрешённых DNS-клиентов"
  ansible.builtin.set_fact:
    _dns_allowed_clients: >-
      {{ dns_allowed_clients | default(
           groups['access_proxies'] | default([]) | map('extract', hostvars, 'ansible_host') | list
           + (dns_extra_clients | default([]))) | unique | list }}

# Определяем upstream DNS-серверы в зависимости от роли
# access → unbound на upstream-нодах; upstream → публичные DNS из inventory
- name: "Направить Unbound access в локальный транспорт DoH"
  ansible.builtin.set_fact:
    _dns_forwarders: >-
      {{ ['127.0.0.1@' ~ (dns_doh_bridge_port | default(5353) | string)] }}
  when: proxy_role == 'access'

- name: "Настроить пересылку DNS с upstream на публичные резолверы"
  ansible.builtin.set_fact:
    _dns_forwarders: "{{ dns_servers | default(['9.9.9.9', '8.8.8.8', '1.1.1.1']) }}"
  when: proxy_role == 'upstream'

- name: "Разместить конфигурацию Unbound"
  ansible.builtin.template:
    src: unbound.conf.j2
    dest: /etc/unbound/unbound.conf.aiproxy-staged
    owner: root
    group: root
    mode: '0644'
    validate: 'unbound-checkconf %s'


# Firewall: DNS-правила для upstream управляются в основном playbook
# (nftables-upstream.conf.j2 / iptables / ufw)
