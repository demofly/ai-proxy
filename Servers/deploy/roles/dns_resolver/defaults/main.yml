---
# [AITS] 2026-08-29T11:04:55Z
# Сопровождение версий пакетов из репозиториев ОС (unbound, dns-root-data).
#   true  — прогон доводит пакеты роли до последней доступной версии;
#   false — версии замораживаются на установленных.
# Умолчание роли повторяет умолчание playbook.yml, чтобы роль оставалась
# работоспособной при отдельном запуске по тегу `dns`. Действующее значение
# задаётся в inventory и перекрывает это (умолчания роли — низший приоритет).
service_upgrades_enabled: true

# Состояние пакета, выведенное из флага выше.
pkg_state: "{{ 'latest' if service_upgrades_enabled | bool else 'present' }}"

# Порт для локального unbound
dns_resolver_port: 53

# Включение DNSSEC-валидации
dns_resolver_dnssec: true

# Размер кеша (в МБ) — автовычисляется в tasks если не задан
# dns_resolver_cache_mb: 64

# Количество потоков — автовычисляется по CPU если не задан
# dns_resolver_threads: 2

# Срок кеширования записей проектом НЕ задаётся и переменной не имеет:
# unbound держит запись ровно столько, сколько объявила сама зона. В шаблоне
# templates/unbound.conf.j2 нижнего предела нет (умолчание unbound — 0),
# а потолки-умолчания unbound (86400 с положительные, 3600 с отрицательные)
# сняты там явным максимумом — иначе они молча усекали бы срок зоны сверху.
# Ручки для срока здесь нет намеренно: оставленная переменная — приглашение
# вернуть переопределение, и тогда требование «срок строго по зонам»
# отменялось бы одной строкой инвентори.
#
# Понадобится аварийная выдача записи после истечения срока (доступность
# в ущерб строгости срока) — заводится ОТДЕЛЬНЫЙ явный выключатель
# dns_resolver_serve_expired: false (умолчание — выключено) и парный
# dns_resolver_serve_expired_ttl. Переменные срока при этом не возвращаются:
# вопрос доступности отделён от вопроса срока.

# Prefetch: фоновое обновление популярной записи в последние 10 % её срока.
# Срок, отдаваемый клиенту, не удлиняет; гасит прирост запросов к вышестоящим
# резолверам от снятого нижнего предела.
dns_resolver_prefetch: true

# Дополнительные клиенты DNS сверх группы access_proxies (список IPv4-адресов).
# Расширяет allowlist разом для unbound access-control и правил firewall.
# Пусто — доступ к резолверу upstream имеют только access-ноды из inventory.
dns_extra_clients: []

# Внутренний TLS DoH Unbound; за SNI-маршрутизатором слушает только loopback.
dns_doh_backend_port: 8443
# Внутренние порты access: локальный транспорт, HTTP/2 Unbound, TLS nginx.
dns_doh_bridge_port: 5353
dns_doh_local_port: 5443
dns_doh_tls_port: 4446
# Публичный DoH требует отдельное DNS-имя и email ACME в inventory.
dns_doh_enabled: false
# Версия и SHA256 опубликованных архивов AdGuardTeam/dnsproxy.
dnsproxy_version: '0.86.0'
dnsproxy_checksums:
  amd64: sha256:17ac43f76ebfcedf547c663f6f31aa70e68b8eb6fc41d2fc37d3bfe21a2ced66
  arm64: sha256:eda840d39da0c2777ea2431d3d73407e813e3fc0e411bfe256a9fb4b97d08247

# Отдельные SNI и loopback-relay межсерверного DoH на общем внешнем 443.
dns_doh_sni: dns.transit.internal
dns_doh_relay_port: 4447
