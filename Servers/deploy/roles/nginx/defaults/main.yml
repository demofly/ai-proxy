---
mtproxy_fake_tls_domain: max.ru
# [AITS] 2026-08-29T11:04:55Z
# Умолчания роли nginx (ai-assistants-proxy).

# Сопровождение версий пакетов из репозиториев ОС.
#   true  — прогон доводит пакеты роли до последней доступной версии;
#   false — версии замораживаются на установленных, сводится только конфигурация.
# Умолчание роли повторяет умолчание playbook.yml, чтобы роль оставалась
# работоспособной при отдельном запуске по тегу `nginx`. Действующее значение
# задаётся в inventory и перекрывает это (умолчания роли — низший приоритет).
#
# Последствие включённого режима для nginx названо в tasks/main.yml: служба на
# узле общая, обновление пакета перезапускает её и рвёт соединения соседних
# проектов.
service_upgrades_enabled: true

# Состояние пакета, выведенное из флага выше. Отдельная переменная нужна, чтобы
# выражение не повторялось в каждой задаче установки.
pkg_state: "{{ 'latest' if service_upgrades_enabled | bool else 'present' }}"
