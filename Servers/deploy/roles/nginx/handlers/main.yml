# [AITS] 2026-08-29T11:04:55Z
# reset-failed снимает stale job markers, оставшиеся от предыдущих неудачных
# попыток перезагрузки или перезапуска демона: без этого systemd отказывает
# в новой операции над юнитом, помеченным как failed.
#
# Обработчик у роли ОДИН и он перезагружающий. Перезапуск как способ применить
# конфигурацию из роли изъят намеренно: nginx на узле общий, и его перезапуск
# рвёт соединения соседних проектов, тогда как reload оставляет обслуживать
# прежние соединения старым рабочим процессам и переводит на новую
# конфигурацию только новые. Ранее рядом стоял обработчик «Restart nginx»,
# которого не вызывала ни одна задача: он не применялся, но предлагал себя
# первому, кто допишет notify. Перезапуск остаётся у двух операций, где он
# неизбежен и выполняется не обработчиком: остановка при первой установке
# (задача роли) и обновление пакета (postinst-сценарий nginx).
- name: "Перечитать конфигурацию nginx"
  ansible.builtin.shell: |
    systemctl reset-failed nginx 2>/dev/null || true
    if systemctl is-active --quiet nginx; then
      systemctl reload nginx
    else
      systemctl start nginx
    fi
  changed_when: true
