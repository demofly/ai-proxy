---
# [AITS] 2026-08-30T21:49:11Z
# AI-GENERATED — NOT REVIEWED

# --- CrowdSec repository ---

- name: "Проверить интервал обновления Hub CrowdSec"
  ansible.builtin.assert:
    that: crowdsec_hub_update_interval | string is match('^[0-9]+$')
    fail_msg: "crowdsec_hub_update_interval должен быть целым неотрицательным числом секунд."

- name: "Создать каталог ключей репозиториев apt"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: "Загрузить GPG-ключ CrowdSec"
  ansible.builtin.shell:
    cmd: curl -fsSL https://packagecloud.io/crowdsec/crowdsec/gpgkey | gpg --dearmor -o /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg
    creates: /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg
  register: _crowdsec_key

- name: "Добавить репозиторий apt CrowdSec"
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/crowdsec_crowdsec.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg] https://packagecloud.io/crowdsec/crowdsec/any/ any main
      deb-src [signed-by=/etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg] https://packagecloud.io/crowdsec/crowdsec/any/ any main

  register: _crowdsec_repository

- name: "Обновить кеш apt после добавления репозитория CrowdSec"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if (_crowdsec_key.changed or _crowdsec_repository.changed) else apt_cache_valid_time | default(3600) | int }}"

# --- Install CrowdSec packages ---

# Check first: unconditionally configuring dpkg can run unrelated postinst
# scripts on a shared host. A genuine recovery failure must stop deployment.
- name: "Восстановить dpkg только при незавершённых операциях"
  ansible.builtin.shell: |
    set -eu
    pending="$(dpkg --audit)"
    if [ -n "$pending" ]; then
      dpkg --configure -a
      printf 'CONFIGURED\n'
    fi
  register: _crowdsec_dpkg_recovery
  changed_when: "'CONFIGURED' in _crowdsec_dpkg_recovery.stdout"

# One package transaction, with the same package-upgrade policy as other roles.
- name: "Установить CrowdSec и firewall bouncer"
  ansible.builtin.apt:
    name: [crowdsec, crowdsec-firewall-bouncer-nftables]
    state: "{{ pkg_state }}"
  environment:
    CROWDSEC_PACKAGE_DISABLE_WIZARD: "1"
  throttle: 1
  register: _crowdsec_packages

# SQLite connections each retain native/page-cache memory outside GOMEMLIMIT.
# Preserve operator/neighbor settings while bounding the local SQLite pool.
- name: "Прочитать базовую конфигурацию CrowdSec"
  ansible.builtin.slurp:
    src: /etc/crowdsec/config.yaml
  register: _crowdsec_base_config
  no_log: true

- name: "Проверить наличие локальных переопределений CrowdSec"
  ansible.builtin.stat:
    path: /etc/crowdsec/config.yaml.local
  register: _crowdsec_local_config_file

- name: "Прочитать локальные переопределения CrowdSec"
  ansible.builtin.slurp:
    src: /etc/crowdsec/config.yaml.local
  register: _crowdsec_local_config_raw
  when: _crowdsec_local_config_file.stat.exists
  no_log: true

- name: "Сохранить существующую локальную конфигурацию CrowdSec"
  ansible.builtin.set_fact:
    _crowdsec_local_config: '{{ _crowdsec_local_config_raw.content | default("e30=") | b64decode | from_yaml | default({}, true) }}'
  no_log: true

- name: "Ограничить пул SQLite CrowdSec с сохранением остальных настроек"
  ansible.builtin.copy:
    dest: /etc/crowdsec/config.yaml.local
    mode: '0600'
    content: '{{ _crowdsec_local_config | combine({"db_config": {"max_open_conns": 1}}, recursive=true) | to_nice_yaml }}'
  when: >-
    ((_crowdsec_base_config.content | b64decode | from_yaml)
     | combine(_crowdsec_local_config, recursive=true)).db_config.type == 'sqlite'
  notify: "Перезапустить CrowdSec"
  no_log: true

# --- Whitelist infrastructure IPs (prevent banning our own nodes) ---

- name: "Разместить список доверенных узлов инфраструктуры для CrowdSec"
  ansible.builtin.template:
    src: whitelist-infrastructure.yaml.j2
    dest: /etc/crowdsec/parsers/s02-enrich/whitelist-infrastructure.yaml
    owner: root
    group: root
    mode: "0644"
  notify: "Перезапустить CrowdSec"

# --- Acquisition config (which logs to monitor) ---

- name: "Проверить наличие прежней конфигурации источников журналов"
  ansible.builtin.stat:
    path: /etc/crowdsec/acquis.yaml
  register: _acquis_previous

- name: "Прочитать прежнюю конфигурацию источников журналов"
  ansible.builtin.slurp:
    src: /etc/crowdsec/acquis.yaml
  register: _acquis_previous_content
  when: _acquis_previous.stat.exists

# Каталог источников: каждый проект узла владеет своим файлом и чужих не касается.
# Прежде роль перезаписывала общий /etc/crowdsec/acquis.yaml целиком, отчего прогон
# после соседнего проекта затирал его источники.
- name: "Создать каталог источников журналов CrowdSec"
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# Миграция: прежний общий файл, если он порождён этой ролью, заменяется пустым.
# Признак авторства — строка Ansible и заголовок нашего шаблона; чужой файл не трогаем.
- name: "Отключить прежнюю конфигурацию источников журналов этой роли"
  ansible.builtin.copy:
    content: |
      # Источники журналов вынесены в /etc/crowdsec/acquis.d/ по файлу на проект.
      # Файл оставлен пустым намеренно: его прежнее содержимое принадлежало
      # ai-assistants-proxy и перенесено в acquis.d/aiproxy.yaml.
    dest: /etc/crowdsec/acquis.yaml
    owner: root
    group: root
    mode: '0644'
  when: _acquis_previous.stat.exists and 'sources for attack detection' in (_acquis_previous_content.content | default('') | b64decode)
  notify: "Перезапустить CrowdSec"

- name: "Разместить конфигурацию источников журналов CrowdSec"
  ansible.builtin.template:
    src: acquis.yaml.j2
    dest: /etc/crowdsec/acquis.d/aiproxy.yaml
    owner: root
    group: root
    mode: "0644"
  notify: "Перезапустить CrowdSec"

# --- Systemd memory limits ---

# Прежде предел писался в файл с именем, совпадающим с именем файла соседнего
# проекта: кто прогонялся последним, тот и задавал предел, молча заменив чужой.
# Файл снимается, а свой пишется с префиксом проекта — так владелец значения
# виден по имени, а не по времени последнего прогона.
- name: "Удалить устаревший файл предела памяти CrowdSec с общим именем"
  ansible.builtin.file:
    path: /etc/systemd/system/crowdsec.service.d/memory-limit.conf
    state: absent
  register: _crowdsec_legacy_unit
  notify: "Перезапустить CrowdSec"

- name: "Создать каталог переопределений systemd для CrowdSec"
  ansible.builtin.file:
    path: /etc/systemd/system/crowdsec.service.d
    state: directory
    mode: "0755"

- name: "Разместить предел памяти systemd для CrowdSec"
  ansible.builtin.copy:
    dest: /etc/systemd/system/crowdsec.service.d/10-aiproxy-memory.conf
    mode: "0644"
    content: |
      [Service]
      # Go's soft limit excludes executable/file mappings and cgo memory.
      # Keep 64 MiB outside it, rather than forcing hot pages out at small caps.
      Environment=GOMEMLIMIT={{ [(mem_crowdsec_mb | int * 0.65) | int, mem_crowdsec_mb | int - 64] | min }}MiB
      MemoryMax={{ mem_crowdsec_mb }}M
  register: _crowdsec_unit
  notify: "Перезапустить CrowdSec"

- name: "Создать каталог переопределений systemd для bouncer CrowdSec"
  ansible.builtin.file:
    path: /etc/systemd/system/crowdsec-firewall-bouncer.service.d
    state: directory
    mode: "0755"

- name: "Разместить предел памяти systemd для bouncer CrowdSec"
  ansible.builtin.copy:
    dest: /etc/systemd/system/crowdsec-firewall-bouncer.service.d/memory-limit.conf
    mode: "0644"
    content: |
      [Service]
      Environment=GOMEMLIMIT={{ (mem_crowdsec_bouncer_mb | int * 0.65) | int }}MiB
      MemoryMax={{ mem_crowdsec_bouncer_mb | default(24) }}M
  register: _crowdsec_bouncer_unit
  notify: "Перезапустить bouncer CrowdSec"

- name: "Перечитать конфигурацию systemd после настройки CrowdSec"
  ansible.builtin.systemd:
    daemon_reload: true
  when: _crowdsec_legacy_unit.changed or _crowdsec_unit.changed or _crowdsec_bouncer_unit.changed

# --- Enable and start services ---

- name: "Включить автозапуск и запустить CrowdSec"
  ansible.builtin.systemd:
    name: crowdsec
    state: started
    enabled: true

- name: "Включить автозапуск и запустить bouncer CrowdSec"
  ansible.builtin.systemd:
    name: crowdsec-firewall-bouncer
    state: started
    enabled: true

# Hub metadata is not runtime configuration. Only changed active files require
# applying the engine; a successful catalog download alone never restarts it.
- name: "Разместить синхронизацию Hub CrowdSec"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/sync-crowdsec-hub.py"
    dest: /usr/local/sbin/aiproxy-crowdsec-hub
    mode: '0755'

- name: "Синхронизировать Hub CrowdSec при истечении срока или дрейфе правил"
  vars:
    _crowdsec_effective_config: "{{ (_crowdsec_base_config.content | b64decode | from_yaml) | combine(_crowdsec_local_config, recursive=true) }}"
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/sbin/aiproxy-crowdsec-hub', '--interval', crowdsec_hub_update_interval | string,
          '--database', _crowdsec_effective_config.db_config.db_path | default('') | string]
         + (['--force'] if crowdsec_hub_force_update | bool or _crowdsec_packages.changed else []) }}
  register: _crowdsec_hub_sync
  changed_when: (_crowdsec_hub_sync.stdout | default('{"changed":false}', true) | from_json).changed | bool
  retries: 3
  delay: 10
  until: _crowdsec_hub_sync.rc == 0
  when: not ansible_check_mode
  notify: "Перезапустить CrowdSec"

# Apply and acknowledge before leaving the role. A failed/interrupted apply is
# remembered by the synchronizer and retried even while the Hub cache is fresh.
- name: "Применить ожидающие изменения CrowdSec до завершения роли"
  ansible.builtin.meta: flush_handlers
