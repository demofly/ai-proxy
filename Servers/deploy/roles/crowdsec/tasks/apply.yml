---
- name: "Проверить конфигурацию CrowdSec перед применением"
  ansible.builtin.command: crowdsec -t
  changed_when: false

- name: "Применить изменённую конфигурацию CrowdSec"
  ansible.builtin.systemd:
    name: crowdsec
    state: restarted

- name: "Подтвердить применение текущих правил CrowdSec"
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/aiproxy-crowdsec-hub
      - --ack
      - "{{ (_crowdsec_hub_sync.stdout | from_json).digest }}"
  changed_when: false
  when: _crowdsec_hub_sync.stdout | default('') | length > 0
