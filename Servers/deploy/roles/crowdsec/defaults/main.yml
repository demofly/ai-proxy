---
# [AITS] 2026-08-29T11:04:55Z
# Умолчания роли crowdsec (ai-assistants-proxy).

# Сопровождение версий пакетов CrowdSec из репозитория packagecloud.
#   true  — прогон доводит crowdsec и crowdsec-firewall-bouncer до последней
#           доступной версии; служба перезапускается сценарием пакета;
#   false — версии замораживаются на установленных.
# Умолчание роли повторяет умолчание playbook.yml, чтобы роль оставалась
# работоспособной при отдельном запуске по тегу `crowdsec`. Действующее значение
# задаётся в inventory и перекрывает это (умолчания роли — низший приоритет).
#
# Правила детектирования (коллекции хаба) обновляются НЕЗАВИСИМО от этого флага:
# они не пакет, а содержимое, и отставание правил обесценивает саму службу.
service_upgrades_enabled: true

# Состояние пакета, выведенное из флага выше.
pkg_state: "{{ 'latest' if service_upgrades_enabled | bool else 'present' }}"
