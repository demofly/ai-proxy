---
- name: "Проверить переменные узла access-01"
  hosts: access-01
  gather_facts: false
  tasks:
    - name: "Показать значение proxy_role"
      debug:
        msg: "Роль узла proxy_role: {{ proxy_role | default('не задана') }}"

    - name: "Показать значение nginx_on_443"
      debug:
        msg: "Работа за nginx на порту 443 (nginx_on_443): {{ nginx_on_443 | default('не определено') }}"

    - name: "Показать результат условия подключения nginx"
      debug:
        msg: "Условие подключения nginx: proxy_role='{{ proxy_role | default('не задана') }}' и nginx_on_443={{ nginx_on_443 | default(false) | bool }}"

    - name: "Проверить условие подключения роли nginx"
      debug:
        msg: "Условие подключения роли nginx выполнено."
      when:
        - proxy_role == 'access'
        - nginx_on_443 | default(false) | bool
