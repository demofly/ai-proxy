---
# [AITS] 2026-08-30T21:49:11Z
# Ansible Playbook для развертывания AI Proxy на базе Squid
# Использование: ansible-playbook -i inventory.yml playbook.yml

- name: "Развернуть ai-proxy на базе Squid"
  hosts: all
  become: true

  vars:
    squid_config_path: /etc/squid/squid.conf
    squid_passwd_path: /etc/squid/passwd

    # =========================================================================
    # Сопровождение версий пакетов из репозиториев ОС
    # =========================================================================
    # Требование: развёртывание переводит узел на новые стабильные версии и при
    # этом остаётся идемпотентным. Оба свойства обеспечивает `state: latest`:
    # прогон приводит пакет к последней доступной в репозитории версии, а
    # повторный прогон при неизменившемся репозитории не делает ничего.
    #
    # `service_upgrades_enabled` задаётся в inventory и по умолчанию включён.
    # Выключение (`false`) замораживает версии на установленных: прогон сводит
    # только конфигурацию. Это режим для инцидента и для узла, версии которого
    # держит внешнее требование, а не рядовой режим.
    #
    # ПОСЛЕДСТВИЕ, которое флаг не устраняет: обновление пакета службы
    # перезапускает её силами postinst-сценария пакета — до и помимо Ansible.
    # Клиентские соединения Squid, nginx и unbound при этом рвутся. Поэтому
    # задачи установки служб несут `throttle: 1`: узлы обновляются по одному, и
    # пара access-нод под VIP (равно как и пара upstream-резолверов) не уходит
    # в перезапуск разом.
    #
    # Исключение из режима обновления одно и названо по месту — nftables
    # (см. задачу «Установить nftables»): его ExecStop сбрасывает ruleset целиком,
    # включая таблицы CrowdSec bouncer.
    pkg_state: "{{ 'latest' if (service_upgrades_enabled | default(true) | bool) else 'present' }}"

    # Единый источник истины: кому разрешён доступ к DNS-резолверу (unbound)
    # upstream-нод на порту 53/tcp и 53/udp. Список потребляют ВСЕ точки
    # ограничения — unbound access-control, nftables, UFW, iptables, — чтобы
    # правило не расходилось между бэкендами.
    # Формируется из IP группы access_proxies; dns_extra_clients — необязательное
    # расширение из inventory (например, нода вне группы или отдельный резолвер).
    dns_allowed_clients: >-
      {{ (groups['access_proxies'] | default([]) | map('extract', hostvars, 'ansible_host') | list
          + (dns_extra_clients | default([]))) | unique | list }}

    # =========================================================================
    # Бюджет памяти узла
    # =========================================================================
    # Правило: сумма ЖЁСТКИХ пределов всех служб узла не превышает выделяемого
    # объёма — доли RAM за вычетом резерва ядра и того, что забрали соседние
    # проекты. Остаток нужен ядру, страничному кешу, sshd и журналу: без него
    # узел уходит в отказ раньше, чем сработает предел любой отдельной службы.
    #
    # Target RAM/3, raised to service minima; at most 1000000000 bytes.
    # Service floors/weighted allocation live in filter_plugins/resources.py.

  pre_tasks:
    - name: "Проверить параметры клиентского HTTPS-прокси"
      ansible.builtin.assert:
        that:
          - proxy_role == 'access'
          - enable_auth | default(false) | bool
          - behind_nginx | default(true) | bool
          - https_proxy_hostname | default('') is match('^(?=.{1,253}$)([a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,63}$')
          - https_proxy_hostname | default('') | lower not in [mtproxy_fake_tls_domain | default('max.ru') | lower, mtproxy_hostname | default('') | lower, squid_tls_sni | default('transit.internal') | lower]
          - https_proxy_local_port | default(4445) | int > 1024
          - https_proxy_local_port | default(4445) | int < 65536
          - https_proxy_local_port | default(4445) | int not in [443, squid_local_port | default(3128) | int, squid_mgmt_port | default(3129) | int, mtproxy_relay_port | default(9443) | int]
          - https_proxy_certificate | default('/etc/letsencrypt/live/' ~ https_proxy_hostname | default('') ~ '/fullchain.pem') is match('^/[^\s;{}]+$')
          - https_proxy_certificate_key | default('/etc/letsencrypt/live/' ~ https_proxy_hostname | default('') ~ '/privkey.pem') is match('^/[^\s;{}]+$')
        fail_msg: >-
          HTTPS-прокси требует access с enable_auth=true, nginx на 443,
          отдельное DNS-имя https_proxy_hostname, свободный локальный порт
          и абсолютные пути к публично доверенному сертификату и ключу без пробелов.
        success_msg: "Параметры клиентского HTTPS-прокси проверены."
      when: https_proxy_enabled | default(false) | bool
      tags: [always]

    - name: "Проверить параметры выпуска сертификата HTTPS-прокси"
      ansible.builtin.assert:
        that:
          - https_proxy_enabled | default(false) | bool
          - https_proxy_acme_email | default('') is match('^[^\s@]+@[^\s@]+\.[^\s@]+$')
          - https_proxy_acme_webroot | default('/var/www/certbot') is match('^/[^\s;{}]+$')
          - https_proxy_certificate is not defined
          - https_proxy_certificate_key is not defined
        fail_msg: >-
          Автоматический ACME требует включённый HTTPS-прокси, контактный email,
          абсолютный webroot без пробелов и стандартные пути Let’s Encrypt.
          Все A/AAAA имени должны вести на этот узел с доступным портом 80.
        success_msg: "Параметры выпуска сертификата HTTPS-прокси проверены."
      when: https_proxy_acme_enabled | default(false) | bool
      tags: [always]

    # Отсутствие флага сохраняет прежний транспорт. TLS включается явно
    # и требует согласованного развёртывания upstream перед access.
    - name: "Определить параметры TLS-участка с учётом inventory"
      ansible.builtin.set_fact:
        squid_transit_tls: '{{ squid_transit_tls | default(false) | bool }}'
        squid_tls_sni: '{{ squid_tls_sni | default("transit.internal") }}'
      tags: [always]

    # Проверка непустоты имени: пустое дало бы сертификат без имени и молчаливый
    # отказ проверки подлинности на стороне access — то есть неработающий участок
    # при внешне успешном развёртывании.
    - name: "Проверить наличие имени TLS-участка"
      ansible.builtin.assert:
        that:
          - squid_tls_sni is defined
          - squid_tls_sni | default('') | length > 0
        fail_msg: >-
          Шифрование участка включено (squid_transit_tls), но имя squid_tls_sni не задано.
          По этому имени access объявляет SNI и проверяет подлинность принимающей стороны,
          а маршрутизатор upstream направляет соединение к терминатору. Имя не обязано
          разрешаться в DNS — оно опознавательное, не адресное; годится, например,
          transit.internal. Задайте его в инвентори рядом с прочими переменными участка.
        success_msg: "Имя участка задано: {{ squid_tls_sni | default('') }}."
      when: squid_transit_tls | bool
      tags: [always]

    - name: "Определить пул upstream для Squid на access"
      ansible.builtin.set_fact:
        squid_upstream_hosts: "{{ squid_upstream_hosts | default(groups['upstreams']) }}"
      when: proxy_role == 'access'
      tags: [always]

    - name: "Проверить состав пула upstream для Squid"
      ansible.builtin.assert:
        that:
          - squid_upstream_hosts is sequence and squid_upstream_hosts is not string and squid_upstream_hosts is not mapping
          - squid_upstream_hosts | length > 0
          - squid_upstream_hosts | difference(groups['upstreams']) | length == 0
          - squid_upstream_hosts | unique | length == squid_upstream_hosts | length
        fail_msg: >-
          squid_upstream_hosts должен содержать непустой список без повторов имён узлов
          из группы upstreams. Пустой или неизвестный пул оставил бы access
          без рабочего родительского прокси. Без переопределения используются все upstreams.
        success_msg: "Пул upstream для Squid проверен: {{ squid_upstream_hosts | length }} узлов."
      when: proxy_role == 'access'
      tags: [always]

    - name: "Определить домен fake-TLS MTProxy с учётом inventory"
      ansible.builtin.set_fact:
        mtproxy_fake_tls_domain: '{{ mtproxy_fake_tls_domain | default("max.ru") }}'
      tags: [always]

    - name: "Определить общий секрет MTProxy до изменения узлов"
      ansible.builtin.include_tasks:
        file: tasks/mtproxy-cluster.yml
        apply:
          tags: [always]
      run_once: true
      tags: [always]

    - name: "Обновить сведения об оборудовании перед расчётом ресурсов"
      tags: [always]
      ansible.builtin.setup:
        gather_subset: ['!all', '!min', hardware]

    - name: "Определить параметры ресурсов с учётом inventory"
      tags: [always]
      ansible.builtin.set_fact:
        mem_reserve_share: '{{ mem_reserve_share | default(0.25) }}'
        # The host-derived project budget plus measured foreign limits replaces
        # the old arbitrary 35% split. An operator can still request a lower share.
        mem_share_when_shared: '{{ mem_share_when_shared | default(1.0) }}'
        mem_system_min_mb: '{{ mem_system_min_mb | default(128) }}'
        mem_reserve_when_shared_share: '{{ mem_reserve_when_shared_share | default(0.15) }}'
        mem_foreign_reserved_mb: '{{ mem_foreign_reserved_mb | default(0) }}'

    - name: "Проверить поддержку cgroup v2 до изменения служб"
      tags: [always]
      ansible.builtin.slurp:
        src: /sys/fs/cgroup/cgroup.controllers
      register: _proxy_cgroup_controllers

    - name: "Проверить доступность контроллера памяти cgroup v2"
      tags: [always]
      ansible.builtin.assert:
        that: "'memory' in (_proxy_cgroup_controllers.content | b64decode).split()"
        fail_msg: 'Для ограничения RAM и swap требуется systemd с контроллером памяти cgroup v2.'
        success_msg: 'Контроллер памяти cgroup v2 доступен.'

    - name: "Рассчитать системные пределы ресурсов"
      tags: [always]
      ansible.builtin.set_fact:
        cpu_cores: "{{ ansible_processor_vcpus | default(1) }}"
        ram_mb: "{{ ansible_memtotal_mb | default(2048) }}"
        ram_for_proxy_mb: "{{ (ansible_memtotal_mb | default(2048) / 5) | int }}"
        # Буферы сокетов: 1/20 от выделенной памяти на буфер (в байтах)
        socket_buffer_bytes: "{{ [[((ansible_memtotal_mb | default(2048) / 100) * 1048576) | int, 262144] | max, 1048576] | min }}"
        # Лимиты FD: 4096 на ядро, минимум 65535
        fd_limit: "{{ [ansible_processor_vcpus | default(1) * 4096, 65535] | max }}"
        # Очереди: 8192 на ядро, минимум 65535
        queue_limit: "{{ [[ansible_processor_vcpus | default(1) * 1024, 512] | max, 8192] | min }}"
        # TIME_WAIT buckets: 32768 на ядро
        tw_buckets: "{{ ansible_processor_vcpus | default(1) * 32768 }}"

    # =======================================================================
    # Обнаружение соседнего проекта на узле
    # =======================================================================
    # Признак снимается осмотром при каждом прогоне, а не берётся из объявленной
    # переменной: узел мог стать общим уже после прошлого развёртывания.
    # Осматриваются три каталога модульного nginx — по одному на контекст, куда
    # соседний проект кладёт свои файлы. Собственные имена перечислены поимённо;
    # всё, что не наше, принадлежит соседям.
    - name: "Найти чужие файлы в каталогах расширения nginx"
      tags: [always]
      ansible.builtin.find:
        paths: "{{ item.path }}"
        patterns: "*.conf"
        excludes: "{{ item.own }}"
        file_type: file
        recurse: false
      loop:
        - path: /etc/nginx/stream.d
          own: ["00-sni-router.conf", "10-aiproxy-*.conf", "11-aiproxy-https-proxy.conf", "10-mtproxy-tls.conf",
                "20-squid-tls-term.conf"]
        - path: /etc/nginx/stream.d/sni-map.d
          own: ["aiproxy.conf", "aiproxy-https-proxy.conf", "mtproxy.conf", "squid.conf"]
        - path: /etc/nginx/conf.d
          own: ["default.conf", "aiproxy-https-acme.conf"]
      loop_control:
        label: "{{ item.path }}"
      register: _foreign_nginx_files
      failed_when: false
      changed_when: false

    - name: "Установить признак совместного размещения"
      tags: [always]
      ansible.builtin.set_fact:
        # Объявленное shared_host: true остаётся ручным перекрытием и осмотром
        # не отменяется; осмотр может только поднять признак.
        shared_host: >-
          {{ (shared_host | default(false) | bool)
             or ((_foreign_nginx_files.results | default([])
                  | map(attribute='files') | map('default', []) | list | flatten | length) > 0) }}
        _shared_host_evidence: >-
          {{ (_foreign_nginx_files.results | default([])
              | map(attribute='files') | map('default', []) | list | flatten
              | map(attribute='path') | list) }}

    - name: "Показать результат осмотра узла"
      tags: [always]
      ansible.builtin.debug:
        msg: >-
          Совместное размещение: {{ 'обнаружено' if (shared_host | bool) else 'не обнаружено' }}.
          {{ 'Чужие файлы: ' ~ (_shared_host_evidence | join(', ')) if _shared_host_evidence | length > 0
             else 'Чужих файлов в каталогах расширения nginx нет.' }}
          Верхняя доля памяти до учёта потолка проекта и соседних служб:
          {{ (mem_share_when_shared | float * 100) | int if (shared_host | bool)
             else ((1 - mem_reserve_share | float) * 100) | int }} % памяти узла.

    # Пределы памяти служб: доля RAM, но не ниже нижней границы
    # Выделяемый объём считается ПЕРВЫМ и отдельной задачей: от него зависят пределы
    # служб, а значение факта, вычисленного в том же вызове set_fact, соседним
    # выражениям того же вызова недоступно.
    - name: "Проверить состояние общего nginx перед расчётом бюджета"
      tags: [always]
      ansible.builtin.command: systemctl is-active nginx
      register: _proxy_nginx_state
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Учесть общий nginx в плане ресурсов"
      tags: [always]
      ansible.builtin.set_fact:
        _proxy_nginx_needed: "{{ https_proxy_enabled | default(false) | bool or behind_nginx | default(false) | bool or mtproxy_enabled | default(false) | bool or _proxy_nginx_state.stdout == 'active' }}"

    - name: "Проверить доли памяти и резервы узла"
      tags: [always]
      ansible.builtin.assert:
        that:
          - mem_reserve_share | float > 0 and mem_reserve_share | float < 1
          - mem_reserve_when_shared_share | float > 0 and mem_reserve_when_shared_share | float < 1
          - mem_share_when_shared | float > 0 and mem_share_when_shared | float <= 1
          - mem_foreign_reserved_mb | int >= 0
          - mem_system_min_mb | int >= 128
          - proxy_memory_budget_mb | default(1) | int > 0
        fail_msg: 'Недопустимые резервы или потолок памяти проекта. proxy_memory_budget_mb должен быть положительным; жёсткий верхний предел — 1000000000 байт.'
        success_msg: 'Доли памяти, резервы ОС и потолок проекта заданы корректно.'

    - name: "Получить действующие пределы памяти служб"
      tags: [always]
      ansible.builtin.command:
        argv: [systemctl, show, '*.service', --property=Id, --property=MemoryMax, --property=ActiveState]
      register: _proxy_service_memory
      changed_when: false
      check_mode: false

    - name: "Учесть память служб соседних проектов"
      tags: [always]
      ansible.builtin.set_fact:
        _proxy_foreign_memory: >-
          {{ _proxy_service_memory.stdout | service_memory(
             ['squid.service', 'unbound.service', 'nginx.service', 'haveged.service', 'aiproxy-health.service']
             + (['mtg.service'] if (proxy_role == 'upstream' and mtproxy_enabled | default(false) | bool) else [])
             + (['keepalived.service'] if (proxy_role == 'access' and enable_keepalived | default(false) | bool and keepalived_vip is defined) else [])
             + (['crowdsec.service', 'crowdsec-firewall-bouncer.service'] if crowdsec_enabled | default(false) | bool else [])) }}

    - name: "Проверить пределы памяти или явный резерв соседних приложений"
      tags: [always]
      ansible.builtin.assert:
        that:
          - _proxy_foreign_memory.unbounded | length == 0 or mem_foreign_reserved_mb | int > 0
        fail_msg: "У соседних приложений нет предела памяти: {{ _proxy_foreign_memory.unbounded | join(', ') }}. Настройте MemoryMax или задайте их суммарный резерв mem_foreign_reserved_mb."
        success_msg: 'Для соседних приложений заданы пределы памяти или явный резерв.'

    - name: "Рассчитать резерв памяти ОС и соседних приложений"
      tags: [always]
      ansible.builtin.set_fact:
        mem_foreign_effective_mb: "{{ [_proxy_foreign_memory.reserved_mb, mem_foreign_reserved_mb | int] | max }}"
        mem_system_reserved_mb: >-
          {{ [mem_system_min_mb | int,
              (ansible_memtotal_mb | int * (mem_reserve_when_shared_share | float if shared_host | bool else mem_reserve_share | float)) | round(0, 'ceil') | int] | max }}

    - name: "Определить включённые службы и фиксированные пределы памяти"
      tags: [always]
      ansible.builtin.set_fact:
        _proxy_enabled_services: >-
          {{ ['squid', 'unbound', 'haveged', 'health']
             + (['nginx'] if _proxy_nginx_needed | bool else [])
             + (['mtg'] if proxy_role == 'upstream' and mtproxy_enabled | default(false) | bool else [])
             + (['keepalived'] if proxy_role == 'access' and enable_keepalived | default(false) | bool and keepalived_vip is defined else [])
             + (['crowdsec', 'crowdsec_bouncer'] if crowdsec_enabled | default(false) | bool else []) }}
        _proxy_memory_overrides: >-
          {{ (proxy_memory_limits | default({}))
             | combine({'crowdsec': crowdsec_memory_mb} if crowdsec_memory_mb is defined else {})
             | combine({'crowdsec_bouncer': crowdsec_fw_bouncer_memory_mb} if crowdsec_fw_bouncer_memory_mb is defined else {}) }}

    - name: "Рассчитать минимальную потребность служб в памяти"
      tags: [always]
      ansible.builtin.set_fact:
        _proxy_minimum_plan: '{{ 0 | proxy_memory_plan(_proxy_enabled_services, _proxy_memory_overrides) }}'

    - name: "Рассчитать потолок памяти проекта по RAM узла"
      tags: [always]
      ansible.builtin.set_fact:
        _proxy_budget: >-
          {{ ansible_memtotal_mb | proxy_memory_budget(proxy_memory_budget_mb | default(none),
                                                       _proxy_minimum_plan.minimum_mb) }}

    - name: "Рассчитать доступную память с учётом физических ограничений"
      tags: [always]
      ansible.builtin.set_fact:
        mem_allocatable_mb: >-
          {{ [_proxy_budget.mb | int,
              (ansible_memtotal_mb | int * mem_share_when_shared | float) | int,
               ansible_memtotal_mb | int - mem_system_reserved_mb | int - mem_foreign_effective_mb | int] | min
             if shared_host | bool else [_proxy_budget.mb | int,
               ansible_memtotal_mb | int - mem_system_reserved_mb | int - mem_foreign_effective_mb | int] | min }}

    - name: "Распределить бюджет памяти между включёнными службами"
      tags: [always]
      ansible.builtin.set_fact:
        _proxy_memory_plan: >-
          {{ mem_allocatable_mb | proxy_memory_plan(_proxy_enabled_services, _proxy_memory_overrides) }}

    - name: "Рассчитать пределы памяти каждой службы"
      tags: [always]
      ansible.builtin.set_fact:
        mem_squid_mb: '{{ _proxy_memory_plan.limits.squid }}'
        mem_unbound_mb: '{{ _proxy_memory_plan.limits.unbound }}'
        mem_nginx_mb: '{{ _proxy_memory_plan.limits.nginx }}'
        mem_mtproxy_mb: '{{ _proxy_memory_plan.limits.mtg }}'
        mem_keepalived_mb: '{{ _proxy_memory_plan.limits.keepalived }}'
        mem_crowdsec_mb: '{{ _proxy_memory_plan.limits.crowdsec }}'
        mem_crowdsec_bouncer_mb: '{{ _proxy_memory_plan.limits.crowdsec_bouncer }}'
        mem_haveged_mb: '{{ _proxy_memory_plan.limits.haveged }}'
        mem_health_mb: '{{ _proxy_memory_plan.limits.health }}'

    # Планируемая сумма — только те службы, что действительно разворачиваются
    # на этом узле: набор различается для access и upstream
    - name: "Ограничить число рабочих процессов бюджетом памяти"
      tags: [always]
      ansible.builtin.set_fact:
        squid_workers: "{{ [cpu_cores | int, [mem_squid_mb | int // 64, 1] | max] | min }}"
        nginx_worker_connections: "{{ nginx_worker_connections | default(512) }}"
        proxy_nginx_workers: "{{ [cpu_cores | int, [mem_nginx_mb | int // 48, 1] | max] | min }}"
        mtproxy_effective_max_connections: "{{ [mtproxy_max_connections | default(64) | int, (mem_mtproxy_mb | int - 16) * 8, (4096 - 256) // 4] | min }}"
        squid_fd_limit: "{{ [fd_limit | int, [4096, (mem_squid_mb | int - 16) * 256] | max] | min }}"
        proxy_effective_max_connections: "{{ [proxy_max_connections | default(96) | int, (mem_squid_mb | int - 24) * 6] | min }}"

    - name: "Проверить число рабочих процессов и соединений по бюджету памяти"
      tags: [always]
      ansible.builtin.assert:
        that:
          - mem_squid_mb | int >= 64
          - mem_unbound_mb | int >= 24
          - mem_nginx_mb | int >= 48
          - mem_mtproxy_mb | int >= 32
          - mem_haveged_mb | int >= 8
          - mem_health_mb | int >= 8
          - mem_keepalived_mb | int >= 12
          - not (crowdsec_enabled | default(false) | bool) or mem_crowdsec_mb | int >= 192
          - not (crowdsec_enabled | default(false) | bool) or mem_crowdsec_bouncer_mb | int >= 24
          - squid_workers | int >= 1
          - squid_workers | int * 64 <= mem_squid_mb | int
          - proxy_nginx_workers | int * 48 <= mem_nginx_mb | int
          - nginx_worker_connections | int <= 512
          - proxy_max_connections | default(96) | int >= 1
          - proxy_effective_max_connections | int >= 1
          - proxy_effective_max_connections | int * 4 + 128 <= nginx_worker_connections | int * proxy_nginx_workers | int
          - mtproxy_max_connections | default(64) | int >= 1
          - mtproxy_effective_max_connections | int <= (mem_mtproxy_mb | int - 16) * 8
          - mtproxy_effective_max_connections | int * 4 + 256 <= 4096
          - read_timeout | default('1 hour') | squid_duration_seconds > 0
          - client_lifetime | default('1 day') | squid_duration_seconds > read_timeout | default('1 hour') | squid_duration_seconds
        fail_msg: 'Недопустимый бюджет служб, рабочих процессов, соединений или таймаутов. Проверьте proxy_memory_limits, proxy_max_connections, mtproxy_max_connections и условие read_timeout < client_lifetime.'
        success_msg: 'Рабочие процессы, соединения и таймауты согласованы с бюджетом памяти.'

    - name: "Подсчитать сумму пределов памяти служб узла"
      tags: [always]
      ansible.builtin.set_fact:
        mem_planned_mb: >-
          {{ mem_squid_mb | int + mem_unbound_mb | int + mem_haveged_mb | int + mem_health_mb | int
             + (mem_nginx_mb | int if (_proxy_nginx_needed | bool) else 0)
             + (mem_mtproxy_mb | int if (proxy_role == 'upstream' and mtproxy_enabled | default(false) | bool) else 0)
             + (mem_keepalived_mb | int if (proxy_role == 'access' and enable_keepalived | default(false) | bool and keepalived_vip is defined) else 0)
             + ((mem_crowdsec_mb | int + mem_crowdsec_bouncer_mb | int) if (crowdsec_enabled | default(false) | bool) else 0) }}

    # Проверка выполнимости плана. Отказ развёртывания, а не предупреждение:
    # узел, где сумма пределов превышает выделяемый объём, уходит в отказ по
    # памяти под нагрузкой — то есть тогда, когда обслуживание и нужно.
    # Файл паролей ведётся оператором вне репозитория; пустой файл означает, что
    # подключиться не сможет никто, а выглядеть это будет как неверные учётные данные
    # у всех сразу. Проверяем до развёртывания, на управляющем хосте.
    # Осмотр ожидаемого пути до чтения: при отказе чтения сообщение проверки
    # ниже опирается на эти факты, а не на догадки. Содержимое не читается —
    # в файле хеши паролей.
    # =======================================================================
    # Материал для шифрования участка access → upstream
    # =======================================================================
    # Выпускается на УПРАВЛЯЮЩЕЙ машине, а не на узле: обе стороны участка обязаны
    # получить согласованный сертификат, а порядок обхода узлов плейбуком не определён —
    # выпуск на upstream оставил бы access без доверенного материала при прогоне,
    # начавшемся с access. Каталог исключён из контроля версий: в нём закрытый ключ.
    - name: "Проверить размещение плана памяти на узле"
      tags: [always]
      ansible.builtin.assert:
        that:
          - mem_planned_mb | int <= mem_allocatable_mb | int
          - mem_planned_mb | int == _proxy_memory_plan.total_mb | int
          - mem_planned_mb | int + mem_foreign_effective_mb | int + mem_system_reserved_mb | int <= ansible_memtotal_mb | int
        fail_msg: >-
          План памяти не помещается на узле: сумма пределов служб
          {{ mem_planned_mb }} МиБ при выделяемом объёме {{ mem_allocatable_mb }} МиБ.
          Минимумы и явно заданные пределы требуют {{ _proxy_memory_plan.minimum_mb }} МиБ;
          они не снижаются ради размещения на узле.
          Цель RAM/3 — {{ _proxy_budget.target_bytes }} байт;
          бюджет с учётом минимумов, потолка 1 ГБ и inventory — {{ _proxy_budget.bytes }} байт;
          RAM {{ ansible_memtotal_mb }} МиБ, резерв ОС {{ mem_system_reserved_mb }} МиБ,
          резерв соседей {{ mem_foreign_effective_mb }} МиБ.
          Увеличьте RAM или пересмотрите размещение и явные переопределения пределов,
          сохраняя минимумы служб из filter_plugins/resources.py.
        success_msg: >-
          План памяти помещается: {{ mem_planned_mb }} из {{ mem_allocatable_mb }} МиБ
          выделяемых (RAM {{ ansible_memtotal_mb }} МиБ).
          Пределы включённых служб (МиБ):
          {{ _proxy_memory_plan.limits | dict2items | selectattr('key', 'in', _proxy_enabled_services) | items2dict }}

    # Both projects enforce the complete physical-RAM plan.
    - name: "Показать полный план памяти узла"
      tags: [always]
      ansible.builtin.debug:
        msg: >-
          ai-proxy: {{ mem_planned_mb }} МиБ; цель RAM/3: {{ _proxy_budget.target_bytes }} байт;
          минимумы и фиксированные пределы служб: {{ _proxy_minimum_plan.minimum_mb }} МиБ;
          потолок проекта: {{ _proxy_budget.bytes }} байт (жёсткий предел 1 ГБ);
          резерв соседей: {{ mem_foreign_effective_mb }} МиБ; резерв ОС: {{ mem_system_reserved_mb }} МиБ;
          память узла: {{ ansible_memtotal_mb }} МиБ.
          {% if 'mtg' in _proxy_enabled_services %}Фактический предел сессий MTProxy:
          {{ mtproxy_effective_max_connections }} (потолок inventory: {{ mtproxy_max_connections | default(64) }}).
          {% endif %}
          Фактический предел TLS-сессий участка: {{ proxy_effective_max_connections }}
          (потолок inventory: {{ proxy_max_connections | default(96) }}); предел FD Squid: {{ squid_fd_limit }}.


  tasks:
    # Обновление кеша пакетов
    - name: "Обновить кеш пакетов apt (Debian)"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    # Удаление ненужных пакетов
    - name: "Удалить ненужные пакеты (Debian)"
      ansible.builtin.apt:
        name:
          - packagekit
          - multipath-tools
        state: absent
        purge: true
      when: ansible_os_family == 'Debian'

    - name: "Удалить ненужные пакеты (RHEL)"
      ansible.builtin.dnf:
        name:
          - PackageKit
          - device-mapper-multipath
        state: absent
      when: ansible_os_family == 'RedHat'

    # Настройка SSH - отключение DNS lookup для ускорения подключения
    - name: "Отключить UseDNS в конфигурации sshd"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?UseDNS\s+'
        line: 'UseDNS no'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: "Перечитать конфигурацию sshd"

    # Установка базовых утилит
    # psmisc: killall (используется в keepalived check_and_restart_squid.sh)
    # bsdutils/util-linux: logger (syslog-уведомления из скриптов keepalived)
    #
    # Обновляются до последней доступной версии безоговорочно: ни одна из
    # утилит не держит клиентских соединений, а перезапуск haveged при
    # обновлении незаметен для служб узла.
    # squidclient — способ снятия показателей Squid, названный в требовании
    # к наблюдаемости: частота обращений, доля попаданий в кеш, состояние
    # вышестоящих узлов. В поставку пакета squid он НЕ входит (проверено на узлах
    # Debian 12 и Ubuntu 24.04: `dpkg -L squid` его не содержит) и ставится
    # отдельным пакетом. Без него три метрики неснимаемы, а требование
    # к наблюдаемости выполняется лишь на бумаге.
    - name: "Установить базовые утилиты (Debian)"
      ansible.builtin.package:
        name:
          - mc
          - haveged
          - psmisc
          - bsdutils
          - squidclient
          - curl
        state: "{{ pkg_state }}"
      when: ansible_os_family == 'Debian'

    - name: "Установить базовые утилиты (RHEL)"
      ansible.builtin.dnf:
        name:
          - mc
          - haveged
          - psmisc
          - util-linux
          - curl
        state: "{{ pkg_state }}"
      when: ansible_os_family == 'RedHat'

    - name: "Включить автозапуск и запустить haveged"
      ansible.builtin.systemd:
        name: haveged
        enabled: true
        state: started

    # Минимальная версия Squid объявлена требованием, но не проверялась: узел
    # с более старой версией разворачивался молча, и отказ обнаруживался бы уже
    # в работе. Порог 5.7 — не отраслевой обычай, а измеренное значение: на нём
    # проверены все директивы проекта, включая приём участка под шифрованием,
    # многопроцессный режим и раздельные каталоги кеша.
    - name: "Получить сведения об установленной версии Squid"
      ansible.builtin.command: squid -v
      register: _squid_version_raw
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Определить установленную версию Squid"
      ansible.builtin.set_fact:
        _squid_version: "{{ (_squid_version_raw.stdout.split('Version ')[1]).split()[0].split('-')[0] }}"
      when: _squid_version_raw.rc == 0 and 'Version ' in _squid_version_raw.stdout

    - name: "Проверить поддержку установленной версии Squid"
      ansible.builtin.assert:
        that:
          - _squid_version is defined
          - _squid_version is version(squid_min_version | default('5.7'), '>=')
        fail_msg: >-
          Версия Squid на узле ниже поддерживаемой. Найдено:
          {{ _squid_version | default(_squid_version_raw.stdout_lines[0] | default('команда squid -v не выполнилась')) }};
          требуется не ниже {{ squid_min_version | default('5.7') }}. На более старой версии
          часть директив конфигурации отвергается, и служба не поднимется — либо поднимется,
          молча пропустив ограничения. Обновите пакет либо смените дистрибутив: Debian 12
          даёт 5.7, Ubuntu 24.04 — 6.14.
        success_msg: >-
          Squid {{ _squid_version }} — поддерживается
          (не ниже {{ squid_min_version | default('5.7') }}).
      when: _squid_version_raw.rc == 0

    # Вычисление ресурсных лимитов на основе CPU и RAM
    # CPU: используем все ядра
    # RAM: пределы служб — по бюджету памяти узла (доли и границы заданы в vars)
    - name: "Создать каталог TLS-материала участка на управляющей машине"
      ansible.builtin.file:
        path: "{{ playbook_dir }}/tls"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      run_once: true
      when: squid_transit_tls | default(false) | bool

    # Имя в сертификате обязано совпадать с именем, которое access объявляет в SNI:
    # по нему Squid проверяет подлинность принимающей стороны (tls-domain).
    # SAN задаётся наравне с CN — проверка только по CN снята в современных
    # реализациях TLS, и без SAN сертификат был бы отвергнут.
    - name: "Выпустить самоподписанный сертификат участка access → upstream"
      ansible.builtin.command:
        cmd: >
          openssl req -x509
          -newkey ec -pkeyopt ec_paramgen_curve:prime256v1
          -keyout {{ playbook_dir }}/tls/squid-transit.key
          -out {{ playbook_dir }}/tls/squid-transit.crt
          -days 3650 -nodes
          -subj '/CN={{ squid_tls_sni }}'
          -addext 'subjectAltName=DNS:{{ squid_tls_sni }}'
        creates: "{{ playbook_dir }}/tls/squid-transit.crt"
      delegate_to: localhost
      become: false
      run_once: true
      when: squid_transit_tls | default(false) | bool

    - name: "Ограничить доступ к приватному ключу участка"
      ansible.builtin.file:
        path: "{{ playbook_dir }}/tls/squid-transit.key"
        mode: '0600'
      delegate_to: localhost
      become: false
      run_once: true
      when: squid_transit_tls | default(false) | bool

    # Файл мог остаться от запуска с другим SNI. Проверяем доверенный якорь
    # до его раздачи: creates у выпуска сертификата не обновляет старый SAN.
    - name: "Проверить имя и срок действия сертификата TLS-участка"
      ansible.builtin.command:
        argv:
          - openssl
          - verify
          - -CAfile
          - "{{ playbook_dir }}/tls/squid-transit.crt"
          - -verify_hostname
          - "{{ squid_tls_sni }}"
          - "{{ playbook_dir }}/tls/squid-transit.crt"
      delegate_to: localhost
      become: false
      changed_when: false
      run_once: true
      when:
        - squid_transit_tls | bool
        - not ansible_check_mode

    - name: "Проверить наличие и свойства локального файла паролей"
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/passwd"
      register: _passwd_stat
      delegate_to: localhost
      become: false
      failed_when: false
      when: proxy_role == 'access' and enable_auth | default(false) | bool

    - name: "Показать свойства локального файла паролей"
      ansible.builtin.debug:
        msg: >-
          Каталог плейбука: {{ playbook_dir }} ·
          ожидаемый файл: {{ playbook_dir }}/passwd ·
          существует: {{ _passwd_stat.stat.exists | default('осмотр не выполнен') }} ·
          размер: {{ _passwd_stat.stat.size | default('—') }} ·
          права: {{ _passwd_stat.stat.mode | default('—') }} ·
          ссылка: {{ _passwd_stat.stat.islnk | default('—') }}
      when:
        - proxy_role == 'access' and enable_auth | default(false) | bool
        - not (_passwd_stat.stat.exists | default(false)) or (_passwd_stat.stat.size | default(0) | int) == 0

    - name: "Прочитать локальный файл паролей"
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/passwd"
      register: _passwd_local
      delegate_to: localhost
      # Повышение прав задано на весь плейбук и распространилось бы на эту задачу,
      # то есть файл читался бы под sudo на управляющей машине. Для файла с правами
      # 644 это не нужно, а если sudo там спросит пароль — чтение молча не состоится.
      become: false
      # Однократное выполнение здесь было бы опасно: оно берёт первый узел игры,
      # и условие ниже вычислялось бы для него — при ином порядке узлов в инвентаре
      # задача пропустилась бы для всех, оставив проверку без данных.
      failed_when: false
      when: proxy_role == 'access' and enable_auth | default(false) | bool

    - name: "Проверить наличие учётных записей в файле паролей"
      ansible.builtin.assert:
        that:
          - _passwd_local.content is defined
          - (_passwd_local.content | b64decode).splitlines()
            | map('trim') | reject('eq', '') | reject('match', '#')
            | list | length > 0
        fail_msg: >-
          Проверка подлинности включена, но содержимое файла паролей получить
          не удалось. Причина от Ansible: {{ _passwd_local.msg | default('не сообщена —
          значит файл прочитан, но пуст либо состоит из одних комментариев') }}.
          Осмотр пути: файл существует — {{ _passwd_stat.stat.exists | default('осмотр не выполнен') }}, размер — {{ _passwd_stat.stat.size | default('—') }}, права — {{ _passwd_stat.stat.mode | default('—') }}.
          Ожидаемый путь: {{ playbook_dir }}/passwd на управляющей машине, читается
          без повышения прав. Развернуть без записей можно, но подключиться не смог бы
          никто: сверять пароль не с чем, и все обращения получали бы 407.
          Завести запись: htpasswd -B -C 12 -bn пользователь пароль >> passwd
        success_msg: "Файл паролей содержит учётные записи."
      delegate_to: localhost
      run_once: true
      when: proxy_role == 'access' and enable_auth | default(false) | bool

    - name: "Настроить системные пределы ulimit"
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-proxy.conf
        content: |
          # Лимиты для прокси-сервера ({{ cpu_cores }} ядер, {{ ram_mb }} MB RAM)
          # FD limit: {{ fd_limit }} (4096 на ядро, мин 65535)
          * soft nofile {{ fd_limit }}
          * hard nofile {{ fd_limit }}
          * soft nproc {{ fd_limit }}
          * hard nproc {{ fd_limit }}
          root soft nofile {{ fd_limit }}
          root hard nofile {{ fd_limit }}
        owner: root
        group: root
        mode: '0644'

    # Оптимизация сетевых параметров ядра (привязано к CPU и RAM)
    # NOTE: При co-deployment с Matrix — Matrix common role пропускает конфликтующие
    # параметры (ai_proxy_present=true) и задаёт только свои уникальные:
    # vm.swappiness, net.core.rmem_default, net.core.wmem_default
    - name: "Настроить сетевые параметры sysctl"
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
      loop:
        # Снижение задержек
        - { name: 'net.ipv4.tcp_slow_start_after_idle', value: '0' }
        - { name: 'net.ipv4.tcp_no_metrics_save', value: '1' }
        - { name: 'net.ipv4.tcp_mtu_probing', value: '1' }
        # Уменьшение времени жизни устаревших соединений (в 10 раз)
        - { name: 'net.ipv4.tcp_fin_timeout', value: '6' }
        - { name: 'net.ipv4.tcp_tw_reuse', value: '1' }
        - { name: 'net.ipv4.tcp_keepalive_time', value: '720' }
        - { name: 'net.ipv4.tcp_keepalive_intvl', value: '7' }
        - { name: 'net.ipv4.tcp_keepalive_probes', value: '3' }
        # Увеличение буферов и очередей (привязано к ядрам)
        - { name: 'net.core.somaxconn', value: '{{ queue_limit }}' }
        - { name: 'net.ipv4.tcp_max_syn_backlog', value: '{{ queue_limit }}' }
        - { name: 'net.core.netdev_max_backlog', value: '{{ queue_limit }}' }
        # Буферы памяти для сокетов (привязано к RAM: 1/5 RAM / 20)
        - { name: 'net.core.rmem_max', value: '{{ socket_buffer_bytes }}' }
        - { name: 'net.core.wmem_max', value: '{{ socket_buffer_bytes }}' }
        - { name: 'net.ipv4.tcp_rmem', value: '4096 87380 {{ socket_buffer_bytes }}' }
        - { name: 'net.ipv4.tcp_wmem', value: '4096 65536 {{ socket_buffer_bytes }}' }
        # Расширение диапазона локальных портов
        - { name: 'net.ipv4.ip_local_port_range', value: '1024 65535' }
        # SYN flood защита
        - { name: 'net.ipv4.tcp_syncookies', value: '1' }
        - { name: 'net.ipv4.tcp_max_tw_buckets', value: '{{ tw_buckets }}' }
        # Ускорение обработки пакетов
        - { name: 'net.ipv4.tcp_timestamps', value: '1' }
        - { name: 'net.ipv4.tcp_sack', value: '1' }
        - { name: 'net.ipv4.tcp_window_scaling', value: '1' }
        # Уменьшение памяти для orphan сокетов (привязано к ядрам)
        - { name: 'net.ipv4.tcp_max_orphans', value: '{{ fd_limit }}' }
        - { name: 'net.ipv4.tcp_orphan_retries', value: '1' }

    # ===========================================================================
    # Phase: DNS resolver (unbound caching resolver)
    # ===========================================================================
    # ВАЖНО: upstream-ноды деплоятся первыми (они слушают DNS для access-нод)
    # Порядок: upstreams → access обеспечивается inventory ordering

    - name: "Подключить роль DNS-резолвера"
      ansible.builtin.include_role:
        name: dns_resolver
        apply:
          tags: [dns]
      tags: [dns]

    # Общие задачи для всех прокси

    # Признак первой установки снимается ДО задачи установки: после неё
    # различить «поставили впервые» и «обновили до новой версии» уже нечем —
    # `changed` истинно в обоих случаях. Наличие /etc/squid/squid.conf означает,
    # что пакет на узле уже стоял: файл создаётся установкой пакета.
    - name: "Проверить наличие Squid до установки пакета"
      ansible.builtin.stat:
        path: "{{ squid_config_path }}"
      register: _squid_present_before

    # Обновление Squid перезапускает службу силами postinst-сценария пакета:
    # текущие клиентские сеансы рвутся. `throttle: 1` разводит это по узлам во
    # времени — при паре access-нод под VIP хотя бы одна остаётся рабочей.
    - name: "Установить Squid"
      ansible.builtin.package:
        # GnuTLS в Squid 6.14 принимает tls-domain, но не отправляет SNI.
        # Уже установленный OpenSSL сохраняется и после отключения TLS.
        name: >-
          {{ 'squid-openssl' if ansible_os_family == 'Debian' and
             (squid_transit_tls | bool or '--with-openssl' in (_squid_version_raw.stdout | default('')))
             else 'squid' }}
        state: "{{ pkg_state }}"
      register: squid_installed
      throttle: 1

    - name: "Проверить сборку Squid для TLS-участка"
      ansible.builtin.command: squid -v
      register: _squid_tls_build
      changed_when: false
      check_mode: false
      when: squid_transit_tls | bool

    - name: "Проверить поддержку SNI в сборке Squid"
      ansible.builtin.assert:
        that:
          - "'--with-openssl' in (_squid_tls_build.stdout | default(''))"
        fail_msg: >-
          TLS-участок требует сборку Squid с OpenSSL: GnuTLS в Squid 6.14
          не отправляет SNI, необходимый маршрутизатору upstream. На Debian/Ubuntu
          плейбук выбирает squid-openssl. На других системах установите сборку
          с --with-openssl до включения squid_transit_tls.
        success_msg: "Сборка Squid поддерживает SNI участка через OpenSSL."
      when:
        - squid_transit_tls | bool
        - not ansible_check_mode

    # Fresh install: apt auto-starts Squid with default config.
    # Stop it — we deploy full config first, then start with correct config.
    #
    # Условие проверяет ИМЕННО первую установку, а не факт изменения пакета.
    # Прежняя редакция гейта (`squid_installed.changed`) при переходе на
    # обновления останавливала бы Squid при каждой новой версии в репозитории,
    # а обратный запуск ждал бы конца фазы файрвола — узел стоял бы всю фазу.
    - name: "Остановить новый Squid до подготовки конфигурации"
      ansible.builtin.systemd:
        name: squid
        state: stopped
      when:
        - squid_installed.changed
        - not _squid_present_before.stat.exists

    # systemd override для Squid - лимиты файловых дескрипторов
    # (limits.conf не работает для systemd сервисов)
    - name: "Создать каталог переопределений systemd для Squid"
      ansible.builtin.file:
        path: /etc/systemd/system/squid.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "Настроить пределы systemd для Squid"
      ansible.builtin.copy:
        dest: /etc/systemd/system/squid.service.d/limits.conf
        content: |
          [Service]
          # FD tables consume memory; scale their size within Squid's budget.
          LimitNOFILE={{ squid_fd_limit }}
          LimitNPROC={{ fd_limit }}
          # Жёсткий предел входит в общую проверенную сумму плана.
          # Отдельного мягкого порога вытеснения нет.
          MemoryHigh=infinity
          MemoryMax={{ mem_squid_mb }}M
          TimeoutStopSec=30s
        owner: root
        group: root
        mode: '0644'
      register: squid_systemd_override

    - name: "Перечитать конфигурацию systemd после настройки Squid"
      ansible.builtin.systemd:
        daemon_reload: true
      when: squid_systemd_override.changed | default(false)

    - name: "Создать рабочие каталоги Squid"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: proxy
        group: proxy
        mode: '0755'
      loop:
        - /var/spool/squid
        - /var/log/squid

    # Определяем, работает ли nginx с виртуалхостом на порту 443.
    # Если да — Squid слушает на 127.0.0.1:3128 (nginx терминирует TLS и проксирует).
    # Ручное переопределение: behind_nginx=true/false в inventory.
    - name: "Проверить наличие nginx на порту 443"
      ansible.builtin.shell: |
        set -o pipefail
        if systemctl is-active --quiet nginx 2>/dev/null && \
           grep -rqlE 'listen\s+(443|.*:443)\b' /etc/nginx/sites-enabled/ /etc/nginx/stream.d/ /etc/nginx/conf.d/ 2>/dev/null; then
          echo 'true'
        else
          echo 'false'
        fi
      args:
        executable: /bin/bash
      register: _nginx_443_detect
      changed_when: false
      tags: [nginx]

    - name: "Определить работу Squid за nginx с учётом inventory"
      ansible.builtin.set_fact:
        nginx_on_443: "{{ https_proxy_enabled | default(false) | bool or behind_nginx | default(mtproxy_enabled | default(false) | bool or _nginx_443_detect.stdout | trim | bool) }}"
      tags: [nginx]

    # ===========================================================================
    # Phase: Firewall detection (before roles that need it)
    # ===========================================================================

    - name: "Проверить состояние UFW"
      ansible.builtin.shell: |
        ufw status 2>/dev/null | grep -q '^Status: active' && echo 'active' || echo 'inactive'
      register: ufw_status
      changed_when: false
      failed_when: false

    # =======================================================================
    # Раздача материала участка узлам
    # =======================================================================
    # Upstream получает сертификат И ключ — он принимающая сторона; access получает
    # только сертификат, и служит тот доверенным якорем (tls-cafile), а не средством
    # представиться. Закрытый ключ на access не нужен и потому не передаётся.
    # Роль nginx сама проверяет конфигурацию access через squid -k parse:
    # доверенный CA должен существовать до её запуска, включая первое включение TLS.
    - name: "Разместить сертификат и ключ участка на принимающем узле"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/tls/squid-transit.{{ item.ext }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { ext: 'crt', dest: '/etc/squid/transit.crt', mode: '0644' }
        - { ext: 'key', dest: '/etc/squid/transit.key', mode: '0600' }
      loop_control:
        label: "{{ item.dest }}"
      when:
        - squid_transit_tls | default(false) | bool
        - proxy_role == 'upstream'
      notify: "Перечитать конфигурацию Squid"

    - name: "Разместить доверенный сертификат участка на исходящем узле"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/tls/squid-transit.crt"
        dest: /etc/squid/upstream-transit-ca.crt
        owner: root
        group: root
        mode: '0644'
      when:
        - squid_transit_tls | default(false) | bool
        - proxy_role == 'access'
      notify: "Перечитать конфигурацию Squid"

    # ===========================================================================
    # Phase: nginx и MTProxy (ПЕРЕД конфигурацией Squid)
    # nginx и MTProxy настраиваются раньше Squid, потому что занимают внешний порт 443
    # и определяют, на каком адресе Squid должен слушать: за маршрутизатором он получает
    # петлевой адрес, без него — внешний порт из инвентори.
    # ===========================================================================

    # Роль MTProxy (upstream): ставит nginx, настраивает маршрутизацию по имени SNI
    # на порту 443, удаляет включённый по умолчанию сайт nginx (освобождая порт 80
    # соседним проектам), разворачивает mtg.
    - name: "Подключить роль MTProxy"
      ansible.builtin.include_role:
        name: mtproxy
        apply:
          tags: [mtproxy]
      when:
        - proxy_role == 'upstream'
        - mtproxy_enabled | default(false) | bool
      tags: [mtproxy]

    # nginx role (access): устанавливает nginx на :443, переконфигурирует Squid
    # за nginx (с rollback при ошибке). Деплоит squid-access.conf внутри роли.
    - name: "Подключить роль nginx для маршрутизации SNI"
      ansible.builtin.include_role:
        name: nginx
        apply:
          tags: [nginx]
      when:
        - proxy_role == 'access'
        - nginx_on_443 | default(false) | bool
      tags: [nginx]

    # ===========================================================================
    # Phase: Memory limits for shared and auxiliary services
    # ===========================================================================
    # nginx на узле один и разделяется с соседними проектами; владельцем порта 443
    # и его настроек выступает этот проект, поэтому предел ставит он. Имя файла
    # несёт префикс проекта: соседний проект свой предел на общем узле не ставит.

    - name: "Создать каталог переопределений systemd для nginx"
      ansible.builtin.file:
        path: /etc/systemd/system/nginx.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: _proxy_nginx_needed | bool

    - name: "Удалить устаревший предел Matrix для общего nginx"
      ansible.builtin.file:
        path: /etc/systemd/system/nginx.service.d/memory-limit.conf
        state: absent
      when: _proxy_nginx_needed | bool
      notify: "Перечитать конфигурацию systemd"

    - name: "Настроить предел памяти nginx"
      ansible.builtin.copy:
        dest: /etc/systemd/system/nginx.service.d/10-aiproxy-memory.conf
        content: |
          [Service]
          MemoryHigh=infinity
          MemoryMax={{ mem_nginx_mb }}M
        owner: root
        group: root
        mode: '0644'
      when: _proxy_nginx_needed | bool
      notify: "Перечитать конфигурацию systemd"

    - name: "Создать каталог переопределений systemd для Unbound"
      ansible.builtin.file:
        path: /etc/systemd/system/unbound.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    # Размеры кешей unbound рассчитаны от этого же предела (роль dns_resolver)
    - name: "Настроить предел памяти Unbound"
      ansible.builtin.copy:
        dest: /etc/systemd/system/unbound.service.d/memory-limit.conf
        content: |
          [Service]
          MemoryHigh=infinity
          MemoryMax={{ mem_unbound_mb }}M
        owner: root
        group: root
        mode: '0644'
      notify: "Перечитать конфигурацию systemd"

    # ===========================================================================
    # Phase: Squid configuration
    # ===========================================================================

    # Конфигурация для access прокси (только если MTProxy отключён)
    # При включённом MTProxy deploy squid config происходит в роли nginx
    - name: "Разместить конфигурацию Squid на access без MTProxy"
      ansible.builtin.template:
        src: templates/squid-access.conf.j2
        dest: "{{ squid_config_path }}"
        owner: root
        group: root
        mode: '0644'
        validate: 'squid -k parse -f %s'
      when: proxy_role == 'access' and not (mtproxy_enabled | default(false) | bool)
      register: squid_config_access

    # Конфигурация для upstream прокси
    # Squid слушает 127.0.0.1 за маршрутизатором SNI; порт 80 проект не занимает вовсе.
    # Роль mtproxy удаляет включённый по умолчанию сайт nginx, освобождая 80 для
    # соседних проектов — им он нужен для проверки владения доменом при выпуске
    # сертификатов.
    - name: "Разместить конфигурацию Squid на upstream"
      ansible.builtin.template:
        src: templates/squid-upstream.conf.j2
        dest: "{{ squid_config_path }}"
        owner: root
        group: root
        mode: '0644'
        validate: 'squid -k parse -f %s'
      when: proxy_role == 'upstream'
      register: squid_config_upstream

    # Копирование файла паролей (только access, до reload/restart)
    - name: "Разместить файл паролей Squid на access"
      ansible.builtin.copy:
        src: passwd
        dest: "{{ squid_passwd_path }}"
        owner: root
        group: proxy
        mode: '0640'
      when: proxy_role == 'access' and enable_auth
      notify: "Перечитать конфигурацию Squid"
      tags: passwd

    # Очистка журналов при отключении логирования.
    # Приведение к состоянию, а не пересоздание: прежний цикл «удалить каталог,
    # создать заново» рапортовал changed при каждом прогоне независимо от того,
    # было ли что удалять. Вечное changed обесценивает обнаружение расхождений,
    # шумит в сухом прогоне и способно ложно возбуждать обработчики.
    - name: "Найти остатки журналов Squid при отключённом журналировании"
      ansible.builtin.find:
        paths: /var/log/squid
        patterns: "*"
        file_type: any
      register: _squid_logs_left
      changed_when: false
      failed_when: false
      when: not (enable_logging | default(true) | bool)

    - name: "Удалить остатки журналов Squid"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _squid_logs_left.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      when: not (enable_logging | default(true) | bool)

    # Сам каталог сохраняется: Squid ожидает его существования при запуске.
    - name: "Создать каталог журналов Squid с нужным владельцем"
      ansible.builtin.file:
        path: /var/log/squid
        state: directory
        owner: proxy
        group: proxy
        mode: '0755'
      when: not (enable_logging | default(true) | bool)

    - name: "Применить конфигурацию Squid с учётом параметров запуска"
      ansible.builtin.include_tasks: tasks/squid-apply.yml

    # =======================================================================
    # Ротация журналов Squid
    # =======================================================================
    # Встроенная ротация Squid выключена намеренно (logfile_rotate 0) с пояснением
    # «управляется системой», но правило для системного механизма проект не клал:
    # действовало ли что-либо, зависело от поставки пакета и на узле не проверялось.
    # Заменяем правило поставки: два файла с одним glob дают duplicate log entry
    # и останавливают ротацию Squid. Старое squid-aiproxy снимается при миграции.
    #
    # copytruncate, а не создание нового файла: Squid держит журнал открытым и без
    # переоткрытия продолжал бы писать в переименованный. Штатный сигнал переоткрытия
    # (squid -k rotate) сцеплен с внутренним счётчиком ротаций, отключённым здесь.
    - name: "Удалить устаревшее дублирующее правило ротации журналов Squid"
      ansible.builtin.file:
        path: /etc/logrotate.d/squid-aiproxy
        state: absent

    - name: "Разместить правило ротации журналов Squid"
      ansible.builtin.template:
        src: templates/logrotate-squid.j2
        dest: /etc/logrotate.d/squid
        owner: root
        group: root
        mode: '0644'
      when: enable_logging | default(true) | bool

    # ===========================================================================
    # Phase: Firewall (upstream only)
    # ===========================================================================

    # Настройка firewall (upstream) - UFW (если ufw активен)
    - name: "Настроить UFW на upstream"
      when: proxy_role == 'upstream' and ufw_status.stdout | default('') == 'active'
      block:
        # Обновление ufw безопасно: правила хранятся в /etc/ufw и переживают
        # смену версии, а служба лишь применяет их заново при перезапуске.
        - name: "Установить UFW"
          ansible.builtin.package:
            name: ufw
            state: "{{ pkg_state }}"

        - name: "Разрешить SSH в UFW"
          community.general.ufw:
            rule: allow
            port: '22'
            proto: tcp

        - name: "Разрешить Squid только для access в UFW"
          community.general.ufw:
            rule: allow
            port: "{{ squid_port }}"
            proto: tcp
            from_ip: "{{ hostvars[item]['ansible_host'] }}"
          loop: "{{ groups['access_proxies'] }}"

        # Удалить устаревшее правило UFW для Squid на порту 443
        # (Squid moved from behind nginx:443 to dedicated port)
        # Не удаляем если MTProxy включён — порт 443 используется для SNI router
        - name: "Удалить устаревшее правило UFW для Squid на порту 443"
          community.general.ufw:
            rule: allow
            port: '443'
            proto: tcp
            from_ip: "{{ hostvars[item]['ansible_host'] }}"
            delete: true
          loop: "{{ groups['access_proxies'] }}"
          failed_when: false
          when: squid_port | string != '443' and not (mtproxy_enabled | default(false) | bool)

        - name: "Разрешить TLS MTProxy для access в UFW"
          community.general.ufw:
            rule: allow
            from_ip: "{{ hostvars[item]['ansible_host'] }}"
            to_port: "443"
            proto: tcp
            comment: "MTProxy TLS from {{ item }}"
          loop: "{{ groups['access_proxies'] }}"
          when: mtproxy_enabled | default(false) | bool

        # DNS-резолвер upstream доступен только access-нодам.
        # item.0 — IP клиента из dns_allowed_clients, item.1 — транспорт (tcp/udp)
        - name: "Разрешить DNS Unbound для access в UFW"
          community.general.ufw:
            rule: allow
            port: '53'
            proto: "{{ item.1 }}"
            from_ip: "{{ item.0 }}"
          loop: "{{ dns_allowed_clients | product(['tcp', 'udp']) | list }}"

        # Явный отказ прочим источникам. Дублирует default deny incoming, но
        # переживает ручную смену политики по умолчанию и делает ограничение
        # видимым в `ufw status`. Порядок важен: правило добавляется ПОСЛЕ allow.
        - name: "Запретить DNS для остальных источников в UFW"
          community.general.ufw:
            rule: deny
            port: '53'
            proto: "{{ item }}"
            comment: "DNS deny: not an access proxy"
          loop:
            - tcp
            - udp

        - name: "Включить UFW с запретом входящих соединений по умолчанию"
          community.general.ufw:
            state: enabled
            default: deny
            direction: incoming

        - name: "Сохранить UFW как механизм ограничения DNS"
          ansible.builtin.set_fact:
            dns_firewall_backend: ufw

    # Настройка firewall (upstream) - nftables (Debian без ufw)
    - name: "Подготовить интеграцию межсетевого экрана с соседними проектами"
      ansible.builtin.include_tasks: tasks/shared-firewall.yml

    - name: "Настроить nftables на upstream (Debian)"
      when: proxy_role == 'upstream' and ansible_distribution == 'Debian' and ufw_status.stdout | default('') != 'active'
      block:
        # ЕДИНСТВЕННОЕ исключение из режима обновления, и вот почему.
        # ExecStop юнита nftables — `nft flush ruleset`, то есть перезапуск при
        # обновлении пакета снимает ВЕСЬ набор правил узла, включая таблицы
        # CrowdSec bouncer и правила соседних проектов, а восстанавливает только
        # /etc/nftables.conf. По той же причине handler ниже делает reload, а не
        # restart. Обновление nftables — операция планового окна, выполняется
        # оператором вручную вместе со сверкой действующих правил после неё.
        # Уязвимости пакета закрывает unattended-upgrades (только security).
        - name: "Установить nftables"
          ansible.builtin.package:
            name: nftables
            state: present

        - name: "Проверить наличие общей таблицы nftables"
          ansible.builtin.command: nft -j list table inet filter
          register: _proxy_existing_nft_table
          changed_when: false
          failed_when: false
          check_mode: false

        - name: "Прочитать прежнюю конфигурацию владельца nftables"
          ansible.builtin.slurp:
            src: /etc/nftables.conf
          register: _proxy_existing_nft_config
          failed_when: false

        - name: "Проверить принадлежность общей таблицы nftables"
          ansible.builtin.assert:
            that:
              - >-
                _proxy_existing_nft_table.rc != 0 or
                ('# nftables Configuration - Upstream Proxy' in
                 (_proxy_existing_nft_config.content | default('') | b64decode)
                 and '# Managed by Ansible' in
                 (_proxy_existing_nft_config.content | default('') | b64decode)) or
                (_proxy_existing_nft_table.stdout | nft_empty_default_table)
            fail_msg: >-
              Существующая таблица inet filter не принадлежит ai-proxy. Замена её
              цепочек input/forward/output запрещена; сначала согласуйте интеграцию межсетевого экрана узла.
            success_msg: 'Таблица inet filter отсутствует, принадлежит ai-proxy или содержит только пустые стандартные цепочки.'

        - name: "Разместить конфигурацию nftables"
          ansible.builtin.template:
            src: templates/nftables-upstream.conf.j2
            dest: /etc/nftables.conf
            owner: root
            group: root
            mode: '0644'
            validate: '/usr/sbin/nft -c -f %s'
          notify: "Перечитать конфигурацию nftables"

        - name: "Включить автозапуск и запустить nftables"
          ansible.builtin.systemd:
            name: nftables
            enabled: true
            state: started

        - name: "Сохранить nftables как механизм ограничения DNS"
          ansible.builtin.set_fact:
            dns_firewall_backend: nftables

    # Настройка firewall (upstream) - iptables с собственной цепочкой (без ufw, без Debian)
    # Ветка покрывает Ubuntu с неактивным ufw (состояние после чистой установки)
    # и RHEL-семейство. Имя цепочки историческое: она фильтрует все входящие
    # сервисы upstream-ноды — Squid, MTProxy (443) и DNS (53).
    - name: "Настроить отдельную цепочку iptables на upstream"
      when: proxy_role == 'upstream' and ansible_distribution != 'Debian' and ufw_status.stdout | default('') != 'active'
      vars:
        squid_chain: SQUID-PROXY
        iptables_rules_path: /etc/iptables/aiproxy-upstream.rules
      block:
        # Минимальные образы Ubuntu/RHEL идут без iptables: без установки ветка
        # обрывается на первой же задаче, и порт 53 остаётся открытым.
        # Пакет персистентности (iptables-persistent / iptables-services) НЕ ставим:
        # он восстанавливает при загрузке снимок ВСЕГО ruleset и тем самым откатывал бы
        # правила co-deployment проектов (Matrix) к состоянию на момент нашего деплоя.
        # Восстановлением своей цепочки занимается юнит aiproxy-firewall ниже.
        # Обновление iptables безопасно: пакет не несёт службы, действующие
        # правила живут в ядре и сменой версии утилиты не затрагиваются.
        - name: "Установить iptables"
          ansible.builtin.package:
            name: iptables
            state: "{{ pkg_state }}"

        - name: "Создать каталог правил iptables"
          ansible.builtin.file:
            path: "{{ iptables_rules_path | dirname }}"
            state: directory
            owner: root
            group: root
            mode: '0755'

        # Весь набор правил цепочки — одним файлом; он же источник для
        # восстановления при загрузке. validate проверяет разбор до применения.
        - name: "Разместить правила отдельной цепочки для IPv4 и IPv6"
          ansible.builtin.template:
            src: '{{ item.template }}'
            dest: '{{ item.path }}'
            owner: root
            group: root
            mode: '0644'
            validate: '{{ item.restore }} --test %s'
          loop:
            - {template: templates/iptables-upstream.rules.j2, path: '{{ iptables_rules_path }}', restore: iptables-restore}
            - {template: templates/ip6tables-upstream.rules.j2, path: /etc/iptables/aiproxy-upstream-v6.rules, restore: ip6tables-restore}

        # `--noflush` заменяет ТОЛЬКО объявленную в файле цепочку и делает это одной
        # транзакцией: окна с пустой цепочкой (в котором порт 53 открыт) не возникает,
        # а цепочки co-deployment проектов и правила INPUT остаются нетронутыми.
        # Изменение определяется сравнением цепочки до и после — команда идемпотентна
        # по результату, но не по факту запуска.
        - name: "Атомарно применить отдельную цепочку с сохранением чужих правил"
          ansible.builtin.shell: |
            set -e
            before=$({{ item.command }} -S {{ squid_chain }} 2>/dev/null || true)
            {{ item.command }}-restore --wait 10 --noflush {{ item.path }}
            after=$({{ item.command }} -S {{ squid_chain }})
            [ "$before" = "$after" ] || echo CHANGED
          args:
            executable: /bin/bash
          register: iptables_chain_applied
          changed_when: "'CHANGED' in iptables_chain_applied.stdout"
          loop:
            - {command: iptables, path: '{{ iptables_rules_path }}'}
            - {command: ip6tables, path: /etc/iptables/aiproxy-upstream-v6.rules}

        - name: "Проверить переход из INPUT в отдельную цепочку"
          ansible.builtin.shell: |
            {{ item }} -C INPUT -j {{ squid_chain }} 2>/dev/null && echo 'exists' || echo 'missing'
          register: chain_jump_check
          changed_when: false
          failed_when: false
          loop: [iptables, ip6tables]

        - name: "Добавить переход в отдельную цепочку в начало INPUT"
          ansible.builtin.shell: |
            {{ item.item }} --wait 10 -I INPUT 1 -j {{ squid_chain }}
          when: item.stdout == 'missing'
          loop: '{{ chain_jump_check.results }}'

        # Восстановление при загрузке — только своей цепочки и своего перехода из
        # INPUT. Полное восстановление ruleset (iptables-persistent) здесь запрещено
        # правилом co-deployment: оно вернуло бы и чужие правила из нашего снимка.
        - name: "Разместить службу восстановления отдельной цепочки при загрузке"
          ansible.builtin.copy:
            dest: /etc/systemd/system/aiproxy-firewall.service
            owner: root
            group: root
            mode: '0644'
            content: |
              [Unit]
              Description=AI Proxy upstream firewall ({{ squid_chain }} chain)
              DefaultDependencies=no
              After=local-fs.target
              Documentation=file://{{ iptables_rules_path }}
              Wants=network-pre.target
              Before=network-pre.target nginx.service squid.service unbound.service mtg.service

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/bin/sh -ec 'iptables-restore --wait 10 --noflush {{ iptables_rules_path }}; iptables -C INPUT -j {{ squid_chain }} 2>/dev/null || iptables --wait 10 -I INPUT 1 -j {{ squid_chain }}'
              ExecStart=/bin/sh -ec 'ip6tables-restore --wait 10 --noflush /etc/iptables/aiproxy-upstream-v6.rules; ip6tables -C INPUT -j {{ squid_chain }} 2>/dev/null || ip6tables --wait 10 -I INPUT 1 -j {{ squid_chain }}'

              [Install]
              WantedBy=multi-user.target
          register: aiproxy_fw_unit

        - name: "Перечитать конфигурацию systemd после настройки межсетевого экрана"
          ansible.builtin.systemd:
            daemon_reload: true
          when: aiproxy_fw_unit.changed

        - name: "Включить восстановление отдельной цепочки при загрузке"
          ansible.builtin.systemd:
            name: aiproxy-firewall
            enabled: true

        - name: "Сохранить iptables как механизм ограничения DNS"
          ansible.builtin.set_fact:
            dns_firewall_backend: iptables

    # ===========================================================================
    # Phase: Firewall verification (upstream only)
    # ===========================================================================
    # Проверка читает ДЕЙСТВУЮЩИЕ правила ядра, а не шаблон: иначе «правило
    # написано» неотличимо от «правило применено». Handlers сбрасываются заранее —
    # без этого при изменении конфигурации nftables сверялась бы прежняя загрузка.
    # Только для upstream: на access-нодах в очереди может стоять Перечитать конфигурацию Squid,
    # а Squid там запускается позже по ходу плейбука.

    - name: "Применить ожидающие изменения межсетевого экрана перед проверкой"
      ansible.builtin.meta: flush_handlers
      when: proxy_role == 'upstream'

    - name: "Проверить ограничение доступа к DNS на upstream"
      when: proxy_role == 'upstream'
      tags: [firewall, dns]
      block:
        # Дамп всех трёх бэкендов сразу: какой из них реально применён,
        # определяется дистрибутивом и состоянием ufw
        - name: "Получить действующие правила всех механизмов межсетевого экрана"
          ansible.builtin.shell: |
            nft list table inet filter 2>/dev/null || true
            ufw status verbose 2>/dev/null || true
            iptables -S 2>/dev/null || true
          args:
            executable: /bin/bash
          register: dns_fw_dump
          changed_when: false

        - name: "Проверить ограничение DNS на порту 53 TCP/UDP адресами access"
          ansible.builtin.assert:
            that:
              - dns_firewall_backend is defined
              - dns_fw_dump.stdout is search('dport (53|domain)|53/(tcp|udp)')
              - dns_allowed_clients | reject('in', dns_fw_dump.stdout) | list | length == 0
            fail_msg: >-
              Ограничение доступа к DNS (53/tcp+udp) не найдено в действующих правилах
              межсетевого экрана (механизм: {{ dns_firewall_backend | default('не определён') }}).
              Резолвер unbound на {{ ansible_host }}:53 остаётся доступен посторонним.
            success_msg: >-
              DNS (53/tcp+udp) ограничен access-нодами
              [{{ dns_allowed_clients | join(', ') }}], механизм: {{ dns_firewall_backend }}.

    # ===========================================================================
    # Phase: автоматические обновления безопасности (unattended-upgrades)
    # ===========================================================================
    # Прежде пакет ставился только на upstream и не настраивался вовсе: узлы
    # различались по поведению, а само поведение задавалось умолчаниями образа,
    # то есть было неизвестным. Теперь состояние объявлено явно и одинаково
    # на всех узлах.
    #
    # Разделение обязанностей:
    #   unattended-upgrades — ТОЛЬКО обновления безопасности, без участия
    #     оператора: ждать очередного прогона Ansible ради закрытия уязвимости
    #     нельзя;
    #   Ansible (`state: latest` выше) — переход на новые стабильные версии,
    #     по решению оператора и в известный ему момент.
    #
    # Автоматическая перезагрузка запрещена: узел с VIP, уходящий в ребут сам по
    # себе, ломает VRRP-переключение непредсказуемо для оператора. Перезагрузка
    # после обновления ядра — ручная операция планового окна.
    - name: "Установить unattended-upgrades (Debian)"
      ansible.builtin.package:
        name: unattended-upgrades
        state: "{{ pkg_state }}"
      when: ansible_os_family == 'Debian'

    - name: "Включить периодические автоматические обновления"
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
      when: ansible_os_family == 'Debian'

    # Собственный файл с префиксом проекта: умолчания дистрибутива в
    # 50unattended-upgrades не правим, чтобы обновление самого пакета не
    # порождало конфликт conffile. Файлы apt.conf.d читаются по возрастанию
    # имени, и «52…» читается после «50…» — наши значения побеждают.
    - name: "Ограничить автоматические обновления исправлениями безопасности"
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52aiproxy-unattended-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          // Развёрнуто Ansible (ai-assistants-proxy). Правки вручную будут перезаписаны.
          //
          // Только источники обновлений безопасности: смену стабильных версий
          // выполняет Ansible, а не фоновый таймер.
          //
          // #clear обязателен: перечень в apt.conf — список, и повторное
          // объявление ДОПОЛНЯЕТ его, а не заменяет. Без очистки строки ниже
          // были бы украшением, а действовал бы перечень из 50unattended-upgrades
          // вместе со всем, что туда дописали до нас.
          #clear Unattended-Upgrade::Origins-Pattern;
          Unattended-Upgrade::Origins-Pattern {
              "origin=Debian,codename=${distro_codename},label=Debian-Security";
              "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
              "origin=Ubuntu,archive=${distro_codename}-security";
          };
          // Перезагрузка — только руками оператора (см. комментарий в playbook).
          Unattended-Upgrade::Automatic-Reboot "false";
      when: ansible_os_family == 'Debian'

    - name: "Включить автозапуск и запустить Squid"
      ansible.builtin.systemd:
        name: squid
        enabled: true
        state: started

    - name: "Настроить локальную проверку работоспособности служб"
      ansible.builtin.include_tasks: tasks/health.yml

    # ===========================================================================
    # Phase: Keepalived (access proxies only, VRRP failover)
    # ===========================================================================

    - name: "Сообщить о пропуске Keepalived без VIP"
      ansible.builtin.debug:
        msg: "Keepalived пропущен: переменная keepalived_vip не задана в inventory. Для включения VRRP укажите keepalived_vip."
      when: proxy_role == 'access' and enable_keepalived | default(false) and keepalived_vip is not defined

    # Обновление keepalived перезапускает демона VRRP: узел на время теряет
    # роль MASTER, VIP переезжает на BACKUP и возвращается. Одно переключение
    # штатно, одновременное на обеих нодах — отказ VIP целиком, потому что
    # объявлять адрес станет некому. `throttle: 1` не даёт задаче выполниться
    # более чем на одном узле разом.
    - name: "Установить Keepalived на access"
      ansible.builtin.package:
        name: keepalived
        state: "{{ pkg_state }}"
      when: proxy_role == 'access' and enable_keepalived | default(false) and keepalived_vip is defined
      throttle: 1

    - name: "Разместить проверку Squid с ограничением частоты перезапусков"
      ansible.builtin.template:
        src: templates/check_and_restart_squid.sh.j2
        dest: /etc/keepalived/check_and_restart_squid.sh
        owner: root
        group: root
        mode: '0755'
      when: proxy_role == 'access' and enable_keepalived | default(false) and keepalived_vip is defined
      notify: "Перезапустить Keepalived"

    - name: "Разместить конфигурацию Keepalived на access"
      ansible.builtin.template:
        src: templates/keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: '0644'
      when: proxy_role == 'access' and enable_keepalived | default(false) and keepalived_vip is defined
      notify: "Перезапустить Keepalived"

    - name: "Разрешить привязку к нелокальному VIP для VRRP"
      ansible.posix.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: '1'
        sysctl_set: true
        state: present
        reload: true
      when: proxy_role == 'access' and enable_keepalived | default(false) and keepalived_vip is defined

    - name: "Включить автозапуск и запустить Keepalived"
      ansible.builtin.systemd:
        name: keepalived
        enabled: true
        state: started
      when: proxy_role == 'access' and enable_keepalived | default(false) and keepalived_vip is defined

    # ===========================================================================
    # Phase: CrowdSec IPS (Intrusion Prevention System)
    # ===========================================================================

    - name: "Подключить роль CrowdSec"
      ansible.builtin.include_role:
        name: crowdsec
      when: crowdsec_enabled | default(false) | bool
      tags: [crowdsec, security]

    - name: "Сохранить механизм межсетевого экрана для общих служб"
      ansible.builtin.copy:
        dest: /etc/shared-host/aiproxy-firewall-backend
        mode: '0644'
        content: "{{ 'ufw' if ufw_status.stdout | default('') == 'active' else dns_firewall_backend | default('unsupported') }}\n"

    - name: "Применить сохранённые правила портов общих служб"
      ansible.builtin.command: /usr/local/sbin/aiproxy-apply-shared-ports
      register: _shared_ports_applied
      changed_when: "'CHANGED' in _shared_ports_applied.stdout"
      when: not ansible_check_mode

    - name: "Выполнить ожидающие обработчики перед переносом служб в общий бюджет"
      ansible.builtin.meta: flush_handlers

    - name: "Применить полный бюджет ресурсов проекта"
      ansible.builtin.include_tasks: tasks/resource-limits.yml

  handlers:
    # Примечание: Squid restart выполняется inline в tasks
    # (требуется логика выбора действия на основе изменённых параметров).
    # Handler ниже — для простого reload (passwd, ACL и т.д.)

    - name: "Перечитать конфигурацию Squid"
      ansible.builtin.systemd:
        name: squid
        state: reloaded
      tags: always

    - name: "Перечитать конфигурацию systemd"
      ansible.builtin.systemd:
        daemon_reload: true

    - name: "Перечитать конфигурацию sshd"
      ansible.builtin.systemd:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: reloaded

    - name: "Перезапустить Keepalived"
      ansible.builtin.systemd:
        name: keepalived
        state: restarted

    # Reload, а не restart: ExecStop юнита nftables — `nft flush ruleset`, то есть
    # restart снимает и таблицы CrowdSec bouncer, а при ошибке в конфигурации
    # оставляет ноду вообще без правил. Reload применяет /etc/nftables.conf одной
    # транзакцией: при ошибке действуют прежние правила.
    - name: "Перечитать конфигурацию nftables"
      ansible.builtin.systemd:
        name: nftables
        state: reloaded
