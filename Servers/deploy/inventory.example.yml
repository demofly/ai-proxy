---
# [AITS] 2026-08-30T16:55:28Z
# Образец инвентаря. Скопируйте в inventory.yml и подставьте значения:
#     cp inventory.example.yml inventory.yml
#
# Рабочий inventory.yml раскрытию не подлежит и исключён из контроля версий
# (.gitignore): он содержит действительные адреса узлов и реквизиты доступа —
# VRRP-пароль, секрет MTProxy. Значения берутся из локального хранилища секретов
# и в отслеживаемые файлы не попадают; здесь остаются только имена ключей.
all:
  children:
    access_proxies:
      hosts:
        access-01:
          ansible_host: 203.0.113.1
          keepalived_state: MASTER
          keepalived_priority: 100
        access-02:
          ansible_host: 203.0.113.2
          keepalived_state: BACKUP
          keepalived_priority: 90
      vars:
        proxy_role: access
        squid_port: 443
        enable_auth: true
        enable_logging: true
        enable_caching: true

        # nginx integration - Squid runs behind nginx on localhost
        # Manual override: set behind_nginx=true to force Squid on localhost (for MTProxy integration)
        behind_nginx: true
        squid_local_port: 3128

        # Keepalived настройки
        enable_keepalived: false
        keepalived_vip: 192.0.2.10

        # keepalived_interface: eth0  # Автоопределение через ansible_default_ipv4.interface
        keepalived_vrid: 51
        keepalived_auth_pass: "<задать в локальном inventory.yml>"
    upstreams:
      hosts:
        upstream-01:
          ansible_host: 198.51.100.11
        upstream-02:
          ansible_host: 198.51.100.12
      vars:
        proxy_role: upstream
        squid_port: 443
        enable_auth: false
        enable_logging: false
        enable_caching: false
        behind_nginx: true
        squid_local_port: 3128

  vars:
    # Automatically min(max(host RAM / 3, enabled service minima), 1000000000 bytes), including shared
    # nginx and local CrowdSec. Individual limits adapt to the enabled services.
    # Optional LOWER project ceiling in MiB; cannot raise the host-derived cap:
    # proxy_memory_budget_mb: 400
    # Optional partial service overrides in MiB; remaining services stay automatic:
    # Minima take priority over RAM/3. Failure only if hard caps/reserves do not fit.
    # proxy_memory_limits:
    #   crowdsec: 192
    # Upper ceiling on ai-proxy TLS transit sessions only, not Matrix.
    # Effective capacity may be lower depending on the allocated service memory.
    # Four nginx connection slots/session; 128 slots reserved at 512 total.
    proxy_max_connections: 96

    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3

    # Долго думающие и молчащие API нельзя досрочно обрывать
    # Предел простоя туннеля: столько соединение живёт без обмена данными.
    # Таймер переармируется при каждой порции, поэтому долгий ответ модели
    # разрывом не грозит — счёт идёт от последнего байта, а не от начала.
    read_timeout: "1 hour"

    # Порт управления: по нему снимаются показатели службы (частота обращений,
    # доля попаданий в кеш, состояние вышестоящих узлов). Слушатель привязан
    # к петлевому адресу и снаружи недостижим. Рабочий порт для этого непригоден:
    # за маршрутизатором он требует заголовок протокола PROXY, при шифровании
    # участка принимает только TLS.
    squid_mgmt_port: 3129

    # === Шифрование участка access → upstream ===
    # Содержимое обращений защищено сквозным шифрованием клиента с сервисом
    # независимо от этой настройки. Она закрывает другое: заголовок CONNECT,
    # то есть ИМЯ целевого сервиса, которое иначе идёт открытым текстом и видно
    # наблюдателю между узлами. Для проекта, где неразличимость обращений
    # заявлена целью, различие существенное — скрыт состав обмена, но не адресат.
    squid_transit_tls: true

    # Имя участка. Опознавательное, НЕ адресное: в DNS разрешаться не обязано.
    # По нему access объявляет SNI и проверяет подлинность принимающей стороны,
    # а маршрутизатор upstream направляет соединение к терминатору.
    # Сертификат выпускается развёртыванием на управляющей машине и раздаётся
    # обеим сторонам; каталог с закрытым ключом исключён из контроля версий.
    squid_tls_sni: "transit.internal"

    # Порт локального терминатора TLS на upstream-узле. Задействуется только там,
    # где Squid слушает за маршрутизатором SNI (при включённом MTProxy); иначе
    # TLS принимает сам Squid на своём порту, и терминатор не разворачивается.
    squid_tls_term_port: 4444

    # Запасной прямой выход при недоступности ВСЕХ вышестоящих узлов.
    # Выбор не технический: прямой выход раскрывает целевому сервису адрес
    # access-узла в РФ — то самое, ради сокрытия чего построен второй уровень.
    # Умолчание — запрет: доступность принесена в жертву неразличимости.
    allow_direct_fallback: false

    # =============================================================================
    # Сопровождение версий пакетов из репозиториев ОС
    # =============================================================================
    # true (умолчание) — прогон доводит пакеты до последней доступной в
    #   репозитории версии (`state: latest`). Повторный прогон при неизменившемся
    #   репозитории не делает ничего: идемпотентность сохраняется.
    # false — версии замораживаются на установленных (`state: present`), прогон
    #   сводит только конфигурацию. Режим инцидента и режим узла, версии которого
    #   держит внешнее требование; рядовым режимом не является.
    #
    # Флаг двигает: squid, nginx + libnginx-mod-stream, unbound + dns-root-data,
    # keepalived, ufw, iptables, unattended-upgrades, базовые утилиты
    # (mc, haveged, psmisc, bsdutils), crowdsec, crowdsec-firewall-bouncer-nftables.
    #
    # Флаг НЕ двигает:
    #   nftables — его ExecStop сбрасывает ruleset узла целиком, включая таблицы
    #     CrowdSec bouncer и правила соседних проектов; обновляется вручную в
    #     плановом окне со сверкой действующих правил после;
    #   mtg — версия задана номером в mtproxy_version, не репозиторием;
    #   правила детектирования CrowdSec (коллекции хаба) — обновляются всегда,
    #     независимо от флага: отставшие правила не ловят текущие атаки.
    #
    # ПОСЛЕДСТВИЕ, которое флаг не отменяет: обновление пакета службы
    # перезапускает её сценарием пакета, и клиентские соединения рвутся. Задачи
    # установки служб несут `throttle: 1` — узлы обновляются по одному, поэтому
    # пара access-нод под VIP и пара upstream-резолверов не уходят в перезапуск
    # разом.
    #
    # РАЗДЕЛЯЕМЫЕ СЛУЖБЫ УЗЛА. nginx на узле один, и CrowdSec тоже один. На узле
    # совместного размещения их обновляет ТОЛЬКО проект-владелец службы; второй
    # проект держит у себя service_upgrades_enabled: false либо не разворачивает
    # соответствующую роль. Иначе два прогона будут двигать версию общей службы
    # по очереди, каждый перезапуская её у соседа.
    service_upgrades_enabled: true

    # Кеш имён САМОГО Squid — он независим от кеша резолвера unbound и живёт
    # в памяти процесса Squid. Резолвер срок не ограничивает и берёт его из
    # записей зон, поэтому верхняя граница всего пути разрешения имён задаётся
    # именно отсюда.
    #   positive_dns_ttl — ВЕРХНИЙ предел хранения положительного ответа;
    #   negative_dns_ttl — и предел отрицательных ответов, и НИЖНЯЯ граница
    #   положительных (документация Squid), поэтому большое значение здесь
    #   удлинит хранение записи сверх срока, объявленного зоной.
    # Объявлять их следует именно в инвентори, а не в vars playbook: play vars
    # старше inventory vars, и объявленная в playbook величина из инвентори
    # уже не переопределялась бы.
    # Потребители — шаблоны templates/squid-access.conf.j2
    # и templates/squid-upstream.conf.j2 (оба места рендера).
    squid_positive_dns_ttl: "6 hours"
    squid_negative_dns_ttl: "30 seconds"

    # =============================================================================
    # CrowdSec IPS (Intrusion Prevention System)
    # =============================================================================

    # Включение/отключение CrowdSec IPS на всех хостах
    # При включении: устанавливается CrowdSec + firewall bouncer (nftables)
    # TI-фиды от сообщества (70k+ серверов) подключаются автоматически через CAPI
    crowdsec_enabled: true

    # Пределы рассчитываются автоматически и входят в общий жёсткий бюджет.
    # Значения ниже — необязательное переопределение; заданные вручную, они входят
    # в проверку выполнимости наравне с расчётными и могут её не пройти на малом узле.
    # Legacy overrides are still accepted and included in the same sum:
    # Prefer partial proxy_memory_limits overrides instead of the legacy names.

    # Память, отданная соседним проектам на общем узле (0 — узел только наш).
    # На узле, где рядом развёрнут другой проект, укажите его бюджет: иначе оба
    # проекта распределят одну и ту же память дважды.
    mem_foreign_reserved_mb: 0

    # =============================================================================
    # MTProxy (Telegram Proxy)
    # =============================================================================

    # Включение/отключение MTProxy
    # Архитектура: mtproxy daemon на upstream nodes, nginx stream routing на access nodes
    mtproxy_enabled: true

    # Fake-TLS домен для DPI-маскировки (должен быть внешним популярным доменом)
    # ВАЖНО: НЕ используйте свой домен! Используйте популярный CDN или сервис
    # Домен маскировки: посторонний домен, под трафик к которому маскируется MTProxy.
    # Действующее значение задаётся в рабочем инвентори и в репозиторий не вносится:
    # зная домен, узлы проекта можно искать по имени SNI.
    mtproxy_fake_tls_domain: "max.ru"

    # Публичный домен для MTProxy (для маршрутизации в nginx stream SNI)
    # Опционально — используется для маршрутизации трафика на MTProxy backend
    mtproxy_hostname: "tgproxy.example.com"

    # Версия mtg (https://github.com/9seconds/mtg).
    #
    # Значение держится в согласии с умолчанием роли
    # (roles/mtproxy/defaults/main.yml) — оно и есть поддерживаемая проектом
    # версия. Запись здесь нужна затем, чтобы номер был виден оператору рядом с
    # прочими параметрами MTProxy; расхождение двух мест — дефект, а не настройка.
    #
    # Смена номера ведёт к ПЕРЕУСТАНОВКЕ на всех узлах: бинарник ставится в
    # /usr/local/lib/mtg/{версия}/mtg, а /usr/local/bin/mtg переключается на него
    # символьной ссылкой, после чего служба перезапускается. Прогон с прежним
    # номером не делает ничего. Откат — возврат прежнего номера: каталог
    # предыдущей версии остаётся на узле, повторная загрузка не нужна.
    # Проверка совместимости клиентов перед сменой номера — на операторе.
    mtproxy_version: "2.2.8"

    # Контрольная сумма архива mtg заданной версии (SHA-256, без префикса).
    # Пусто — проверка не выполняется. Заполненное значение проверяется при
    # загрузке и закрывает распаковку подменённого стороннего архива в системный
    # каталог. Сумма публикуется в разделе выпуска на GitHub и меняется вместе
    # с mtproxy_version.
    mtproxy_sha256: ""

    # Локальный порт mtg daemon на upstream nodes
    mtproxy_local_port: 2083

    # Секрет для MTProxy (hex). Пусто — сохранение общего существующего секрета;
    # при полном отсутствии генерация одного значения для всего кластера.
    # Сохраняется в /etc/mtproxy/mtg.toml на узлах. Действительное значение
    # в отслеживаемые файлы не вносится.
    mtproxy_secret: ""

    # Верхний предел сессий mtg (не на IP); фактическое число уменьшается
    # автоматически при недостаточном бюджете RAM/FD и выводится в плане.
    mtproxy_max_connections: 100

    mtproxy_users:
      - name: "Initial deployment"
        telegram: "@none"
        granted: "2026-03-16"
        note: "placeholder record"

    # DNS серверы (upstream unbound → plain DNS к публичным резолверам;
    # access unbound → upstream unbound; Squid → 127.0.0.1 unbound)
    dns_servers:
      - 9.9.9.9
      - 8.8.8.8
      - 1.1.1.1

    # Клиенты DNS сверх группы access_proxies (список IPv4).
    # Расширяет allowlist разом для unbound access-control и правил firewall.
    # dns_extra_clients:
    #   - 203.0.113.10
