---
# Keep startup-only settings separate from live reconfiguration. The persistent
# marker records the last successful start, even if another role wrote squid.conf.
- name: "Прочитать новые параметры запуска Squid"
  ansible.builtin.command:
    argv: [grep, -E, '^(http_port|https_port|cache_dir|workers|max_filedescriptors)[[:space:]]', '{{ squid_config_path }}']
  register: _squid_startup_parameters
  changed_when: false

- name: "Создать каталог состояния деплоймента"
  ansible.builtin.file:
    path: /var/lib/aiproxy
    state: directory
    mode: '0755'

- name: "Прочитать последние успешно применённые параметры запуска Squid"
  ansible.builtin.slurp:
    src: /var/lib/aiproxy/squid-startup-parameters
  register: _squid_previous_startup
  failed_when: false

- name: "Проверить необходимые каталоги кеша перед запуском Squid"
  ansible.builtin.stat:
    path: '{{ item }}'
  loop: >-
    {{ ['/var/spool/squid/00'] if squid_workers | int == 1 else
       range(1, squid_workers | int + 1) | map('string') | map('regex_replace', '^(.*)$', '/var/spool/squid/\1/00') | list }}
  register: _squid_cache_trees
  when: enable_caching | default(false) | bool

- name: "Определить необходимость перезапуска Squid"
  ansible.builtin.set_fact:
    squid_restart_required: >-
      {{ (_squid_previous_startup.content | default('') | b64decode | trim)
          != (_squid_startup_parameters.stdout | trim)
         or (_squid_cache_trees.results | default([]) | selectattr('stat', 'defined')
             | selectattr('stat.exists', 'equalto', false) | list | length > 0) }}
    _squid_config_changed: >-
      {{ squid_config_access.changed | default(false) or squid_config_upstream.changed | default(false)
         or _squid_config_deployed.changed | default(false) }}

- name: "Остановить Squid перед изменением параметров запуска"
  ansible.builtin.systemd:
    name: squid
    state: stopped
  when: squid_restart_required | bool

- name: "Инициализировать каталоги кеша при остановленном Squid"
  ansible.builtin.command:
    argv: [squid, -N, -z]
  when:
    - enable_caching | default(false) | bool
    - _squid_cache_trees.results | selectattr('stat.exists', 'equalto', false) | list | length > 0

- name: "Дождаться завершения инициализации кеша"
  ansible.builtin.wait_for:
    path: '{{ item.item }}'
    state: present
    timeout: 30
  loop: '{{ _squid_cache_trees.results | default([]) }}'
  when:
    - enable_caching | default(false) | bool
    - item.stat is defined
    - not item.stat.exists

- name: "Сбросить прежние ошибки ограничения запусков Squid"
  ansible.builtin.command: systemctl reset-failed squid
  changed_when: false
  failed_when: false

- name: "Получить текущее состояние Squid"
  ansible.builtin.command: systemctl is-active squid
  register: _squid_apply_state
  changed_when: false
  failed_when: false

- name: "Перечитать конфигурацию Squid с сохранением установленных туннелей"
  ansible.builtin.systemd:
    name: squid
    state: reloaded
  when:
    - not (squid_restart_required | bool)
    - _squid_config_changed | bool
    - _squid_apply_state.stdout == 'active'

- name: "Запустить настроенный Squid"
  ansible.builtin.systemd:
    name: squid
    state: started
    enabled: true

- name: "Проверить локальную готовность Squid перед сохранением состояния"
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ squid_mgmt_port | default(3129) }}/squid-internal-mgr/info'
    use_proxy: false
    return_content: true
    timeout: 3
  register: _squid_ready
  until: _squid_ready.status | default(0) == 200 and 'Squid Object Cache' in (_squid_ready.content | default(''))
  retries: 5
  delay: 2

- name: "Сохранить успешно применённые параметры запуска Squid"
  ansible.builtin.copy:
    dest: /var/lib/aiproxy/squid-startup-parameters
    content: '{{ _squid_startup_parameters.stdout | trim }}'
    mode: '0644'
