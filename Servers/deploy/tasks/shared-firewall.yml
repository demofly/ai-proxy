---
- name: "Создать каталог правил общих служб"
  ansible.builtin.file:
    path: /etc/shared-host
    state: directory
    mode: '0755'

- name: "Создать постоянную дочернюю цепочку nftables с сохранением правил Matrix"
  ansible.builtin.copy:
    dest: /etc/shared-host/matrix-ports.nft
    content: "return\n"
    force: false
    mode: '0644'

- name: "Установить интеграцию межсетевого экрана с Matrix"
  ansible.builtin.copy:
    src: scripts/apply-shared-ports.py
    dest: /usr/local/sbin/aiproxy-apply-shared-ports
    mode: '0755'

- name: "Настроить восстановление общих портов iptables после загрузки правил владельца"
  ansible.builtin.copy:
    dest: /etc/systemd/system/aiproxy-shared-ports.service
    mode: '0644'
    content: |
      [Unit]
      Description=Shared services port contract for ai-proxy
      After=network-pre.target nftables.service aiproxy-firewall.service
      Before=nginx.service matrix-synapse.service livekit.service coturn.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/aiproxy-apply-shared-ports
      [Install]
      WantedBy=multi-user.target

- name: "Включить сохранённые правила межсетевого экрана для общих служб"
  ansible.builtin.systemd:
    name: aiproxy-shared-ports
    enabled: true
    daemon_reload: true
