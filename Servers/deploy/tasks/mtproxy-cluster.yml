---
- name: "Определить включённые серверы MTProxy"
  ansible.builtin.set_fact:
    _mtproxy_cluster_nodes: '{{ groups["upstreams"] | default([]) | mtproxy_nodes(hostvars) }}'

- name: "Проверить наличие сервера MTProxy для включённых access"
  ansible.builtin.assert:
    that: >-
      _mtproxy_cluster_nodes | length > 0 or
      (groups['access_proxies'] | default([]) | mtproxy_nodes(hostvars) | length == 0)
    fail_msg: MTProxy включён на access, но ни одного включённого сервера upstream нет.
    success_msg: Для включённых access есть сервер MTProxy либо MTProxy отключён.

- name: "Определить единый секрет балансируемого MTProxy"
  when: _mtproxy_cluster_nodes | length > 0
  block:
    - name: "Проверить явные настройки кластера до чтения прежних файлов"
      ansible.builtin.set_fact:
        _mtproxy_requested_plan: '{{ _mtproxy_cluster_nodes | mtproxy_cluster_plan(hostvars, []) }}'
      no_log: true

    - name: "Проверить согласованность настроек включённых серверов MTProxy"
      ansible.builtin.assert:
        that: _mtproxy_requested_plan.error | length == 0
        fail_msg: '{{ _mtproxy_requested_plan.error }}'
        success_msg: 'Явные настройки включённых серверов MTProxy согласованы.'

    - name: "Проверить наличие файлов с существующими секретами MTProxy"
      ansible.builtin.stat:
        path: '/etc/mtproxy/{{ item.1 }}'
      delegate_to: '{{ item.0 }}'
      loop: '{{ _mtproxy_cluster_nodes | product(["mtg.toml", "mtg.env"]) | list }}'
      register: _mtproxy_cluster_files
      when: _mtproxy_requested_plan.secret | length == 0
      no_log: true

    - name: "Прочитать файлы с существующими секретами MTProxy"
      ansible.builtin.slurp:
        src: '{{ item.stat.path }}'
      delegate_to: '{{ item.item.0 }}'
      loop: '{{ _mtproxy_cluster_files.results }}'
      when:
        - _mtproxy_requested_plan.secret | length == 0
        - item.stat.exists | default(false)
      register: _mtproxy_cluster_reads
      no_log: true

    - name: "Определить возможность сохранения существующего секрета MTProxy"
      ansible.builtin.set_fact:
        _mtproxy_cluster_plan: '{{ _mtproxy_cluster_nodes | mtproxy_cluster_plan(hostvars, _mtproxy_cluster_reads.results) }}'
      no_log: true

    - name: "Проверить однозначность секрета MTProxy до изменения служб"
      ansible.builtin.assert:
        that: _mtproxy_cluster_plan.error | length == 0
        fail_msg: '{{ _mtproxy_cluster_plan.error }}'
        success_msg: 'Общий секрет MTProxy определён однозначно; существующие реквизиты сохранены либо запланирована явная ротация или начальная генерация.'

    - name: "Создать закрытый каталог начального секрета на управляющей машине"
      ansible.builtin.file:
        path: '{{ playbook_dir }}/secrets'
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      when: _mtproxy_cluster_plan.secret | length == 0

    - name: "Передать единый секрет MTProxy всем узлам текущего прогона"
      ansible.builtin.set_fact:
        _mtproxy_cluster_secret: >-
          {{ _mtproxy_cluster_plan.secret if _mtproxy_cluster_plan.secret | length > 0 else
             'ee' + (lookup('ansible.builtin.password', playbook_dir + '/secrets/mtproxy-entropy',
                            length=32, chars=['hexdigits']) | lower)
             + (_mtproxy_cluster_plan.domain | mtproxy_domain_hex) }}
      delegate_to: localhost
      delegate_facts: true
      become: false
      no_log: true
